<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COCoLa 団体登録リスト</title>
<style>
:root {
  --green: #1d9e75;
  --green-dark: #0f6e56;
  --blue: #1fa7c9;
  --orange: #ef7f4d;
  --yellow: #f2b134;
  --violet: #6d79d8;
  --pink: #e56b8f;
  --bg: #f7faf8;
  --surface: rgba(255, 255, 255, 0.94);
  --surface-strong: #ffffff;
  --border: rgba(29, 158, 117, 0.12);
  --text: #183128;
  --muted: #607068;
  --shadow: 0 18px 42px rgba(29, 158, 117, 0.10);
  --radius-xl: 28px;
  --radius-lg: 22px;
  --radius-md: 16px;
  --radius-pill: 999px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{
  margin:0;min-height:100%;
  background:
    radial-gradient(circle at top left,rgba(29,158,117,.15),transparent 28%),
    radial-gradient(circle at top right,rgba(109,121,216,.12),transparent 24%),
    radial-gradient(circle at 75% 70%,rgba(239,127,77,.10),transparent 26%),
    linear-gradient(180deg,#fbfefd 0%,var(--bg) 100%);
  color:var(--text);
  font-family:"Meiryo","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  line-height:1.75;letter-spacing:.02em;
}
body{padding:24px}
a{color:inherit}
.page-shell{max-width:1100px;margin:0 auto}

/* ─── header ─── */
.site-header{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:14px 20px;border-radius:24px;
  border:1px solid var(--border);background:var(--surface);box-shadow:var(--shadow);
  margin-bottom:20px;
}
.site-header__brand{display:flex;align-items:center;gap:12px}
.site-header__icon{
  width:40px;height:40px;border-radius:12px;
  background:linear-gradient(135deg,var(--green),#0aa36e);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:700;font-size:14px;flex-shrink:0;
}
.site-header__title{font-weight:700;font-size:15px;line-height:1.3}
.site-header__sub{font-size:12px;color:var(--muted)}
.header-nav{display:flex;gap:8px;flex-wrap:wrap}
.btn{
  display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius-pill);
  font-size:13px;font-weight:600;text-decoration:none;cursor:pointer;border:none;
  transition:opacity .15s,transform .1s;
}
.btn:hover{opacity:.85;transform:translateY(-1px)}
.btn--ghost{border:1px solid var(--border);background:var(--surface-strong);color:var(--text)}
.btn--primary{background:var(--green);color:#fff}

/* ─── intro ─── */
.intro{
  border-radius:var(--radius-xl);padding:32px 36px;margin-bottom:20px;
  border:1px solid var(--border);background:var(--surface);box-shadow:var(--shadow);
}
.intro h1{margin:0 0 8px;font-size:clamp(22px,4vw,32px);font-weight:800;line-height:1.3}
.intro p{margin:0;color:var(--muted);font-size:14px}

/* ─── toolbar ─── */
.toolbar{
  border-radius:var(--radius-lg);padding:20px 24px;margin-bottom:20px;
  border:1px solid var(--border);background:var(--surface);box-shadow:var(--shadow);
  display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;
}
.toolbar-section{display:flex;flex-direction:column;gap:8px;flex:1;min-width:200px}
.toolbar-label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.search-input{
  width:100%;padding:10px 14px;border-radius:var(--radius-pill);
  border:1px solid var(--border);background:var(--surface-strong);
  font-size:14px;color:var(--text);outline:none;
  transition:border-color .2s;
}
.search-input:focus{border-color:var(--green)}

.cats-wrap{display:flex;flex-wrap:wrap;gap:6px}
.cat-pill{
  padding:5px 13px;border-radius:var(--radius-pill);font-size:12px;font-weight:600;cursor:pointer;
  border:1.5px solid var(--border);background:var(--surface-strong);color:var(--muted);
  transition:all .15s;user-select:none;
}
.cat-pill:hover{border-color:var(--green);color:var(--green)}
.cat-pill.active{background:var(--green);border-color:var(--green);color:#fff}
.cat-pill--all.active{background:var(--green-dark)}

/* ─── summary bar ─── */
.summary-bar{
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;
  margin-bottom:16px;font-size:13px;color:var(--muted);
}

/* ─── org grid ─── */
.org-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px}

/* ─── org card ─── */
.org-card{
  border-radius:var(--radius-lg);padding:24px;
  border:1px solid var(--border);background:var(--surface);box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:14px;
  transition:transform .15s,box-shadow .15s;
}
.org-card:hover{transform:translateY(-3px);box-shadow:0 24px 52px rgba(29,158,117,.14)}

.org-card__header{display:flex;align-items:flex-start;gap:14px}
.org-card__icon{
  width:44px;height:44px;border-radius:14px;flex-shrink:0;
  background:linear-gradient(135deg,var(--green),#0aa36e);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:800;font-size:18px;
}
.org-card__icon--blue{background:linear-gradient(135deg,var(--blue),#1586a0)}
.org-card__icon--violet{background:linear-gradient(135deg,var(--violet),#4f5db8)}
.org-card__icon--orange{background:linear-gradient(135deg,var(--orange),#c85e28)}
.org-card__icon--pink{background:linear-gradient(135deg,var(--pink),#b83d65)}
.org-card__icon--yellow{background:linear-gradient(135deg,var(--yellow),#c88a10)}

.org-card__name{font-size:17px;font-weight:800;line-height:1.3;margin:0 0 4px}
.org-card__desc{font-size:13px;color:var(--muted);margin:0}

.org-cats{display:flex;flex-wrap:wrap;gap:5px}
.org-cat-tag{
  padding:3px 10px;border-radius:var(--radius-pill);font-size:11px;font-weight:600;
  background:rgba(29,158,117,.10);color:var(--green-dark);border:1px solid rgba(29,158,117,.18);
}

.org-card__divider{height:1px;background:var(--border);margin:0}

.org-members-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.org-members-list{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.member-chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:4px 10px;border-radius:var(--radius-pill);
  font-size:12px;font-weight:600;
  background:rgba(29,158,117,.07);color:var(--text);
  border:1px solid var(--border);text-decoration:none;
  transition:background .12s;
}
.member-chip:hover{background:rgba(29,158,117,.15)}
.member-chip__avatar{
  width:20px;height:20px;border-radius:50%;object-fit:cover;
  background:var(--green);color:#fff;font-size:10px;
  display:flex;align-items:center;justify-content:center;font-weight:700;
}
.member-chip__avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover}

.org-card__footer{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.member-count{font-size:12px;color:var(--muted)}
.org-link{
  font-size:12px;font-weight:600;color:var(--green);text-decoration:none;
  display:inline-flex;align-items:center;gap:4px;
}
.org-link:hover{text-decoration:underline}

/* ─── no-meta badge ─── */
.badge-nometa{
  font-size:10px;padding:2px 7px;border-radius:var(--radius-pill);
  background:rgba(96,112,104,.08);color:var(--muted);
  border:1px solid rgba(96,112,104,.15);margin-left:6px;vertical-align:middle;
}

/* ─── loading / empty ─── */
.loading{text-align:center;padding:60px 20px;color:var(--muted);font-size:15px}
.empty{text-align:center;padding:60px 20px;color:var(--muted);font-size:15px}

/* ─── support-center link ─── */
.sc-link{
  display:inline-flex;align-items:center;gap:4px;
  font-size:11px;color:var(--blue);font-weight:600;text-decoration:none;
}
.sc-link:hover{text-decoration:underline}

@media(max-width:600px){
  body{padding:12px}
  .intro{padding:20px}
  .toolbar{padding:16px}
  .org-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="page-shell">

  <!-- header -->
  <header class="site-header">
    <div class="site-header__brand">
      <div class="site-header__icon">C</div>
      <div>
        <div class="site-header__title">COCoLa 団体登録リスト</div>
        <div class="site-header__sub">地域で活動する団体の一覧</div>
      </div>
    </div>
    <nav class="header-nav">
      <a class="btn btn--ghost" href="../index.html">COCoLaトップへ戻る</a>
      <a class="btn btn--ghost" href="../member-app/html.html">メンバー一覧</a>
    </nav>
  </header>

  <!-- intro -->
  <section class="intro">
    <h1>地域で活動する団体が、<br>COCoLaに集まっています。</h1>
    <p>COCoLaメンバーが所属する団体の一覧です。印西市市民活動支援センターの活動カテゴリー別に探せます。</p>
  </section>

  <!-- toolbar -->
  <div class="toolbar">
    <div class="toolbar-section" style="max-width:300px">
      <div class="toolbar-label">団体名・キーワードで検索</div>
      <input class="search-input" id="search" type="text" placeholder="団体名・カテゴリー・メンバー名で検索">
    </div>
    <div class="toolbar-section">
      <div class="toolbar-label">カテゴリーで絞り込む <span style="font-size:11px;font-weight:400">（印西市市民活動支援センター 9活動分野）</span></div>
      <div class="cats-wrap" id="catFilter"></div>
    </div>
  </div>

  <!-- summary -->
  <div class="summary-bar">
    <div id="summaryText">読み込み中…</div>
    <a class="sc-link" href="https://inzaici.machikatsu.co.jp/search/index.html?t=group" target="_blank" rel="noopener">
      ↗ 印西市市民活動支援センターで検索
    </a>
  </div>

  <!-- org grid -->
  <div id="orgGrid" class="org-grid">
    <div class="loading">データを読み込んでいます…</div>
  </div>

</div><!-- /page-shell -->

<script>
// ── 設定 ──────────────────────────────────────────────────
const MEMBER_API = 'https://script.google.com/macros/s/AKfycbxQ7gBHJQFVZEXcyisJdiL7xa64RcKzYjzBZLEGlkelSvxXCfPPHTW5eAVHB09aue1p/exec?mode=json';
const META_URL   = '../data/organizations-meta.json';

// 印西市市民活動支援センター冊子『団体紹介』の9活動分野
const ALL_CATS = [
  'まちづくり','奉仕活動','生きがいづくり','平和・人権','健康・福祉',
  '自然・環境','子育て支援','歴史・文化・芸術','災害救援・地域安全'
];

// アイコン配色ローテーション
const ICON_COLORS = ['','--blue','--violet','--orange','--pink','--yellow'];

// ── 状態 ──────────────────────────────────────────────────
let allOrgs = [];
let activeCat = null;
let searchQuery = '';

// ── ユーティリティ ────────────────────────────────────────
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function initials(name){
  if(!name) return '?';
  const n = name.replace(/[（(].*/,'').trim();
  return n.slice(0,1);
}

// ── カテゴリーフィルター描画 ──────────────────────────────
function renderCatFilter(){
  const el = document.getElementById('catFilter');
  el.innerHTML = '<span class="cat-pill cat-pill--all active" data-cat="">すべて</span>'
    + ALL_CATS.map(c =>
        `<span class="cat-pill" data-cat="${esc(c)}">${esc(c)}</span>`
      ).join('');
  el.addEventListener('click', e => {
    const pill = e.target.closest('.cat-pill');
    if(!pill) return;
    activeCat = pill.dataset.cat || null;
    el.querySelectorAll('.cat-pill').forEach(p => p.classList.remove('active'));
    pill.classList.add('active');
    render();
  });
}

// ── 団体名の表記ゆれ統合（メンバー自由入力のゆらぎを正規化）──
// variant（メンバーSSの実値）→ canonical（organizations-meta.json の name）
const ORG_ALIAS = {
  '1ccプロジェクト': '1CCプロジェクト',
  'らんか': 'みんなのおうちらんか',
  '女性防災の会': '防災女性の会'
};
function canonicalOrgName(name){
  const key = String(name || '').trim();
  return ORG_ALIAS[key] || key;
}

// ── メンバーAPIからorg集約 ────────────────────────────────
function aggregateOrgs(members, metaMap){
  const map = new Map();

  members.forEach(m => {
    (m.groups || []).forEach(g => {
      if(!g.name) return;
      const key = canonicalOrgName(g.name);
      if(!map.has(key)){
        map.set(key, {
          name: key,
          url: g.url || '',
          members: [],
          meta: metaMap[key] || null
        });
      }
      map.get(key).members.push(m);
    });
  });

  // metaにあるがメンバーがいない団体は表示しない（データドリブン）
  return [...map.values()].sort((a,b) => b.members.length - a.members.length);
}

// ── フィルタリング ────────────────────────────────────────
function filtered(){
  return allOrgs.filter(org => {
    // カテゴリーフィルター
    if(activeCat){
      const cats = org.meta?.categories || [];
      if(!cats.includes(activeCat)) return false;
    }
    // テキスト検索
    if(searchQuery){
      const q = searchQuery.toLowerCase();
      const inName = org.name.toLowerCase().includes(q);
      const inCats = (org.meta?.categories || []).join(' ').toLowerCase().includes(q);
      const inDesc = (org.meta?.description || '').toLowerCase().includes(q);
      const inMembers = org.members.some(m =>
        (m.nickname || m.name || '').toLowerCase().includes(q)
      );
      if(!inName && !inCats && !inDesc && !inMembers) return false;
    }
    return true;
  });
}

// ── org カード HTML ───────────────────────────────────────
function orgCardHtml(org, idx){
  const colorClass = ICON_COLORS[idx % ICON_COLORS.length] ? `org-card__icon${ICON_COLORS[idx % ICON_COLORS.length]}` : 'org-card__icon';
  const cats = org.meta?.categories || [];
  const desc = org.meta?.description || '';
  const url  = org.meta?.url || org.url || '';

  const catTagsHtml = cats.length
    ? `<div class="org-cats">${cats.map(c => `<span class="org-cat-tag">${esc(c)}</span>`).join('')}</div>`
    : `<div class="org-cats"><span class="org-cat-tag" style="background:rgba(96,112,104,.07);color:var(--muted);border-color:rgba(96,112,104,.15)">未分類</span><span class="badge-nometa" title="data/organizations-meta.json に追記するとカテゴリーを設定できます">要設定</span></div>`;

  const membersHtml = org.members.map(m => {
    const display = m.nickname || m.name || '?';
    const avatarHtml = m.photo
      ? `<span class="member-chip__avatar"><img src="${esc(m.photo)}" alt="" loading="lazy"></span>`
      : `<span class="member-chip__avatar" style="background:var(--green)">${esc(initials(display))}</span>`;
    return `<a class="member-chip" href="../member-app/html.html#${esc(m.id||'')}" title="${esc(display)}">${avatarHtml}<span>${esc(display)}</span></a>`;
  }).join('');

  const footerHtml = `
    <div class="org-card__footer">
      <span class="member-count">メンバー ${org.members.length}人</span>
      ${url ? `<a class="org-link" href="${esc(url)}" target="_blank" rel="noopener">詳細を見る →</a>` : ''}
    </div>`;

  return `
<div class="org-card" data-name="${esc(org.name)}">
  <div class="org-card__header">
    <div class="org-card__icon ${colorClass.replace('org-card__icon','').trim()}" style="${colorClass.includes('--')? '' : ''}">${esc(initials(org.name))}</div>
    <div>
      <div class="org-card__name">${esc(org.name)}</div>
      ${desc ? `<div class="org-card__desc">${esc(desc)}</div>` : ''}
    </div>
  </div>
  ${catTagsHtml}
  <div class="org-card__divider"></div>
  <div>
    <div class="org-members-label">登録メンバー</div>
    <div class="org-members-list">${membersHtml}</div>
  </div>
  ${footerHtml}
</div>`;
}

// ── 描画 ─────────────────────────────────────────────────
function render(){
  const list = filtered();
  const grid = document.getElementById('orgGrid');
  const summary = document.getElementById('summaryText');

  if(list.length === 0){
    grid.innerHTML = '<div class="empty">条件に合う団体が見つかりません。</div>';
    summary.textContent = `${allOrgs.length}団体中 0件を表示`;
    return;
  }

  grid.innerHTML = list.map((org, i) => orgCardHtml(org, i)).join('');
  summary.textContent = `${allOrgs.length}団体中 ${list.length}件を表示`;
}

// ── アイコン配色修正 ──────────────────────────────────────
function applyIconColors(){
  const icons = document.querySelectorAll('.org-card__icon');
  const colors = [
    'linear-gradient(135deg,var(--green),#0aa36e)',
    'linear-gradient(135deg,var(--blue),#1586a0)',
    'linear-gradient(135deg,var(--violet),#4f5db8)',
    'linear-gradient(135deg,var(--orange),#c85e28)',
    'linear-gradient(135deg,var(--pink),#b83d65)',
    'linear-gradient(135deg,var(--yellow),#c88a10)',
  ];
  icons.forEach((el, i) => { el.style.background = colors[i % colors.length]; });
}

// ── メイン ────────────────────────────────────────────────
async function main(){
  renderCatFilter();

  // 検索ボックス
  document.getElementById('search').addEventListener('input', e => {
    searchQuery = e.target.value.trim();
    render();
  });

  // メタ情報とメンバーデータを並列取得
  const [metaRes, memberRes] = await Promise.allSettled([
    fetch(META_URL).then(r => r.json()),
    fetch(MEMBER_API).then(r => r.json())
  ]);

  // metaMapを構築
  const metaMap = {};
  if(metaRes.status === 'fulfilled'){
    (metaRes.value.organizations || []).forEach(o => { metaMap[o.name] = o; });
  }

  // メンバーデータを処理
  let members = [];
  if(memberRes.status === 'fulfilled'){
    const data = memberRes.value;
    if(Array.isArray(data)){
      members = data;
    } else if(data.members){
      members = data.members;
    } else if(data.rows){
      members = parseMemberRows(data.rows);
    }
  } else {
    document.getElementById('orgGrid').innerHTML =
      '<div class="empty">メンバーデータの取得に失敗しました。しばらく経ってから再読み込みしてください。</div>';
    document.getElementById('summaryText').textContent = '取得失敗';
    return;
  }

  allOrgs = aggregateOrgs(members, metaMap);

  render();
  // DOM更新後にアイコン色を適用
  requestAnimationFrame(applyIconColors);
}

// GAS rawデータのパース（member-appと同じ列番号に準拠）
function parseMemberRows(rows){
  if(!rows || rows.length === 0) return [];
  // COL は member-app/html.html と同一の列インデックス
  const COL = {
    nickname: 3, name: 4, photo: 6,
    otherGroups: 18, otherGroupUrl1: 19,
    otherGroup2: 20, otherGroupUrl2: 21,
    daoStatus: 25,
  };
  return rows.map((row, i) => ({
    id: String(i),
    nickname: row[COL.nickname] || '',
    name: row[COL.name] || '',
    photo: row[COL.photo] || '',
    groups: [
      { name: row[COL.otherGroups] || '', url: row[COL.otherGroupUrl1] || '' },
      { name: row[COL.otherGroup2] || '', url: row[COL.otherGroupUrl2] || '' },
    ].filter(g => g.name),
    daoStatus: row[COL.daoStatus] || '',
  }));
}

main().catch(err => {
  console.error(err);
  document.getElementById('orgGrid').innerHTML =
    '<div class="empty">読み込みエラーが発生しました。</div>';
  document.getElementById('summaryText').textContent = 'エラー';
});
</script>
</body>
</html>
