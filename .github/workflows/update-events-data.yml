name: Update events data

# 2026-07-29: サイト運営停止に伴い schedule 無効化。手動起動のみ。
on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Fetch events data from GAS
        run: |
          curl -sL \
            "https://script.google.com/macros/s/AKfycbycw2FBvcm34mS9R8SUNg28KscGqqGjR1zjz3hnLYq8ckgKCZObYaC9kbMs8R2SGXgC/exec?mode=inzai_json&t=$(date +%s)" \
            -o events/rows_new.json \
            --max-time 30 \
            --retry 3 \
            --retry-delay 5

      - name: Validate and stamp timestamp
        run: |
          python3 - <<'EOF'
          import json, time, sys

          with open('events/rows_new.json') as f:
              text = f.read()

          try:
              rows = json.loads(text)
          except Exception as e:
              print(f'JSON parse error (GAS may be down): {e}')
              print(f'Response: {text[:200]}')
              sys.exit(0)   # GAS側エラーはワークフロー失敗にしない

          if not isinstance(rows, list):
              print('Invalid data structure (expected array)')
              sys.exit(0)   # 同上

          data = {
              'rows': rows,
              '_generatedMs': int(time.time() * 1000)
          }

          with open('events/data.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False)

          print(f"OK: {len(rows)} events")
          EOF

      - name: Cleanup temp file
        run: rm -f events/rows_new.json

      - name: Commit and push if changed
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add events/data.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m 'Auto-update events data [skip ci]'
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push && { echo "pushed on attempt $i"; exit 0; }
              echo "push attempt $i failed, retrying in 3s..."
              sleep 3
            done
            echo "push failed after 5 attempts"
            exit 1
          fi
