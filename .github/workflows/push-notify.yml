name: Push Notify

# 2026-07-29: サイト運営停止に伴い push 自動発火を無効化。手動起動のみ。
on:
  workflow_dispatch:
    inputs:
      title:
        description: '通知タイトル'
        required: true
        default: 'COCoLa DAO'
      body:
        description: '通知本文'
        required: true
        default: 'お知らせがあります'

concurrency:
  group: push-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (need previous commit for diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install web-push
        run: npm install web-push@3 --no-save

      - name: Send notifications
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          PUSH_GAS_URL: ${{ secrets.PUSH_GAS_URL }}
          PUSH_API_TOKEN: ${{ secrets.PUSH_API_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TITLE: ${{ github.event.inputs.title }}
          INPUT_BODY: ${{ github.event.inputs.body }}
        run: node scripts/send-push.js
