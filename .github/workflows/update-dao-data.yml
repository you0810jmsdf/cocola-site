name: Update DAO data

# 2026-07-29: サイト運営停止に伴い schedule / repository_dispatch 無効化。手動起動のみ。
on:
  workflow_dispatch:

concurrency:
  group: update-dao-data
  cancel-in-progress: false   # 実行中のジョブを強制終了しない（完了を待つ）

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Fetch DAO data from GAS
        id: fetch
        run: |
          HTTP_CODE=$(curl -sL \
            "https://script.google.com/macros/s/AKfycbzVs_W57Iphxcc5PHShXBNae63CKqjF5fB82tUkQwaf1vyuNWWLgtWZgglY7Qbuuft1/exec?mode=json&t=$(date +%s)" \
            -o dao/data_new.json \
            --max-time 30 \
            --retry 3 \
            --retry-delay 5 \
            -w "%{http_code}")
          echo "http_code=$HTTP_CODE" >> $GITHUB_OUTPUT

      - name: Validate and stamp timestamp
        id: validate
        run: |
          python3 - <<'EOF'
          import json, time, sys

          with open('dao/data_new.json') as f:
              text = f.read()

          try:
              data = json.loads(text)
          except Exception as e:
              print(f'JSON parse error (GAS may be down): {e}')
              print(f'Response: {text[:200]}')
              sys.exit(0)   # GAS側エラーはワークフロー失敗にしない

          if not isinstance(data.get('proposals'), list):
              print('Invalid data structure (missing proposals array)')
              sys.exit(0)   # 同上

          data['_generatedMs'] = int(time.time() * 1000)

          with open('dao/data.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False)

          print(f"OK: {len(data['proposals'])} proposals")
          EOF

      - name: Commit and push if changed
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add dao/data.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m 'Auto-update DAO data [skip ci]'
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push && { echo "pushed on attempt $i"; exit 0; }
              echo "push attempt $i failed, retrying in 3s..."
              sleep 3
            done
            echo "push failed after 5 attempts"
            exit 1
          fi
