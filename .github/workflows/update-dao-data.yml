name: Update DAO data

# 2026-07-29: サイト運営停止に伴い schedule / repository_dispatch 無効化。手動起動のみ。
# 2026-08-07: push処理を rebase方式 → fetch+reset方式 に変更（衝突による連続失敗の恒久対策）
on:
  workflow_dispatch:

# update-*-data 系は全て main に push するため、リポジトリ共通グループで直列化する。
# （members と dao が同時 push して rebase 衝突を起こす事故の再発防止）
concurrency:
  group: cocola-site-main-push
  cancel-in-progress: false   # 実行中のジョブを強制終了しない（完了を待つ）

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Fetch DAO data from GAS
        id: fetch
        run: |
          HTTP_CODE=$(curl -sL \
            "https://script.google.com/macros/s/AKfycbzVs_W57Iphxcc5PHShXBNae63CKqjF5fB82tUkQwaf1vyuNWWLgtWZgglY7Qbuuft1/exec?mode=json&t=$(date +%s)" \
            -o /tmp/dao_raw.json \
            --max-time 30 \
            --retry 3 \
            --retry-delay 5 \
            -w "%{http_code}")
          echo "http_code=$HTTP_CODE" >> $GITHUB_OUTPUT

      - name: Validate payload
        id: validate
        run: |
          python3 - <<'EOF'
          import json, sys

          with open('/tmp/dao_raw.json') as f:
              text = f.read()

          try:
              data = json.loads(text)
          except Exception as e:
              print(f'JSON parse error (GAS may be down): {e}')
              print(f'Response: {text[:200]}')
              sys.exit(0)   # GAS側エラーはワークフロー失敗にしない（payload未生成 → 後段でスキップ）

          if not isinstance(data, dict) or not isinstance(data.get('proposals'), list):
              print('Invalid data structure (missing proposals array)')
              sys.exit(0)   # 同上

          # タイムスタンプは比較対象から外すため、この時点では付けない
          data.pop('_generatedMs', None)

          with open('/tmp/dao_payload.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False)

          print(f"OK: {len(data['proposals'])} proposals")
          EOF

      - name: Prepare apply script
        run: |
          cat > /tmp/apply_dao.py <<'EOF'
          import json, os, sys, time

          PAYLOAD = '/tmp/dao_payload.json'
          TARGET  = 'dao/data.json'

          with open(PAYLOAD, encoding='utf-8') as f:
              new = json.load(f)

          old = None
          if os.path.exists(TARGET):
              try:
                  with open(TARGET, encoding='utf-8') as f:
                      old = json.load(f)
              except Exception:
                  old = None

          # _generatedMs 以外に差分が無ければコミットしない
          # （毎回タイムスタンプだけ書き換えて空コミットを量産していたのが競合の温床だった）
          if isinstance(old, dict):
              o = dict(old)
              o.pop('_generatedMs', None)
              if o == new:
                  print('No substantive change')
                  sys.exit(10)

          out = dict(new)
          out['_generatedMs'] = int(time.time() * 1000)
          with open(TARGET, 'w', encoding='utf-8') as f:
              json.dump(out, f, ensure_ascii=False)
          print('dao/data.json updated')
          EOF

      - name: Commit and push if changed
        run: |
          if [ ! -f /tmp/dao_payload.json ]; then
            echo "No valid payload (GAS error) - skip"
            exit 0
          fi

          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          # rebase は使わない。毎回 origin/main に完全同期してから生成物を載せ直すので
          # マージ衝突が原理的に発生せず、リトライが必ず前進する。
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            set +e
            python3 /tmp/apply_dao.py
            rc=$?
            set -e

            if [ $rc -eq 10 ]; then
              echo "No changes"
              exit 0
            fi
            if [ $rc -ne 0 ]; then
              echo "apply script failed (rc=$rc)"
              exit 1
            fi

            git add dao/data.json
            git commit -m 'Auto-update DAO data [skip ci]'

            if git push; then
              echo "pushed on attempt $i"
              exit 0
            fi

            echo "push attempt $i rejected (remote moved), retrying in 3s..."
            sleep 3
          done

          echo "push failed after 5 attempts"
          exit 1
