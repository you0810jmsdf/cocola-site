name: Update members data

# 2026-07-30: メンバー管理継続のため schedule 復活（他のupdate-*系はworkflow_dispatchのみ維持）
on:
  schedule:
    - cron: '*/5 * * * *'    # 5分ごと（入会・退会即反映のため）
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Fetch members data from GAS
        run: |
          curl -sL \
            "https://script.google.com/macros/s/AKfycbyRVO7fLJx62HS6W3M2_bmPIP9y6stpiVJFM429NMKXzlV24_wGx97xms22QLb1VHsX/exec?mode=json&t=$(date +%s)" \
            -o members/rows_new.json \
            --max-time 30 \
            --retry 3 \
            --retry-delay 5

      - name: Validate and stamp timestamp
        run: |
          python3 - <<'EOF'
          import json, time, sys

          with open('members/rows_new.json') as f:
              text = f.read()

          try:
              data = json.loads(text)
          except Exception as e:
              print(f'JSON parse error (GAS may be down): {e}')
              print(f'Response: {text[:200]}')
              sys.exit(0)   # GAS側エラーはワークフロー失敗にしない

          if not isinstance(data, dict) or not isinstance(data.get('rows'), list):
              print('Invalid data structure (expected {rows: [...], recentWithdrawals: [...]})')
              sys.exit(0)   # 同上

          data['_generatedMs'] = int(time.time() * 1000)

          with open('members/data.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False)

          print(f"OK: {len(data['rows'])} members, {len(data.get('recentWithdrawals', []))} recent withdrawals")
          EOF

      - name: Cleanup temp file
        run: rm -f members/rows_new.json

      - name: Commit and push if changed
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add members/data.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m 'Auto-update members data [skip ci]'
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push && { echo "pushed on attempt $i"; exit 0; }
              echo "push attempt $i failed, retrying in 3s..."
              sleep 3
            done
            echo "push failed after 5 attempts"
            exit 1
          fi
