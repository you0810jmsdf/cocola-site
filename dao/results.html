<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>COCoLa DAO 投票結果と処置の記録</title>
  <meta name="description" content="COCoLa DAOで投票が終了した提案の結果と、その後の処置（実施記録・方針確定など）を一覧で公開しています。メンバー以外の方もご覧いただけます。">
  <meta name="theme-color" content="#1d8f6f">
  <meta property="og:title" content="COCoLa DAO 投票結果と処置の記録">
  <meta property="og:description" content="COCoLa DAOで投票が終了した提案の結果と、その後の処置を公開しています。">
  <meta property="og:type" content="website">
  <link rel="icon" type="image/png" href="../assets/COCoLa_Logo_transparent.png">
  <link rel="apple-touch-icon" href="../assets/icons/icon-180.png">
  <style>
    :root {
      --ink: #1e2522;
      --muted: #66736e;
      --line: #d8e1dc;
      --paper: #ffffff;
      --wash: #f5f8f6;
      --green: #1d8f6f;
      --green-deep: #12634e;
      --coral: #d4544a;
      --gray: #8f9b96;
      --yellow: #d5a628;
      --shadow: 0 8px 24px rgba(29, 54, 45, 0.10);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; color: var(--ink); background: var(--wash);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 16px; line-height: 1.65;
    }
    a { color: var(--green-deep); }
    .header {
      background: var(--paper); border-bottom: 1px solid var(--line);
      padding: 16px 20px; display: flex; align-items: center; justify-content: space-between;
    }
    .header__logo { height: 32px; }
    .header__nav a {
      text-decoration: none; color: var(--ink); font-size: 13px; margin-left: 16px;
    }
    .hero { padding: 24px 20px 12px; max-width: 920px; margin: 0 auto; }
    .hero h1 { margin: 0 0 8px; font-size: 1.4rem; color: var(--green-deep); }
    .hero p { margin: 0; font-size: 0.9rem; color: var(--muted); }
    .filters {
      max-width: 920px; margin: 12px auto 0; padding: 0 20px;
      display: flex; flex-wrap: wrap; gap: 6px;
    }
    .filter-btn {
      padding: 6px 14px; border-radius: 20px; border: 1px solid var(--line);
      background: var(--paper); color: var(--ink); cursor: pointer;
      font-size: 0.85rem; transition: 0.2s;
    }
    .filter-btn.is-active { background: var(--green); color: #fff; border-color: var(--green); }
    .filter-btn:hover:not(.is-active) { background: var(--wash); }
    .summary {
      max-width: 920px; margin: 12px auto 0; padding: 0 20px;
      font-size: 0.82rem; color: var(--muted);
    }
    .list { max-width: 920px; margin: 0 auto; padding: 12px 20px 80px; display: flex; flex-direction: column; gap: 14px; }
    .card {
      background: var(--paper); border: 1px solid var(--line); border-radius: 14px;
      padding: 18px 20px; box-shadow: var(--shadow);
    }
    .card__head {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 6px;
    }
    .card__id { font-size: 0.78rem; color: var(--muted); font-family: ui-monospace, monospace; }
    .badge {
      display: inline-block; padding: 2px 10px; border-radius: 10px;
      font-size: 0.75rem; font-weight: 600;
    }
    .badge--approved { background: #e6f4ee; color: var(--green-deep); }
    .badge--rejected { background: #fdecea; color: var(--coral); }
    .badge--expired  { background: #eef2f0; color: var(--gray); }
    .card__title { margin: 4px 0 6px; font-size: 1.05rem; font-weight: 600; color: var(--ink); }
    .card__meta { font-size: 0.78rem; color: var(--muted); margin-bottom: 10px; display: flex; flex-wrap: wrap; gap: 12px; }
    .bar-wrap {
      background: var(--wash); border-radius: 8px; overflow: hidden; height: 18px;
      display: flex; margin: 8px 0 4px; border: 1px solid var(--line);
    }
    .bar-yes { background: var(--green); height: 100%; }
    .bar-no  { background: var(--coral); height: 100%; }
    .bar-info { font-size: 0.78rem; color: var(--muted); margin-bottom: 12px; }
    .action {
      background: #fbf7ee; border: 1px solid #e9dbb0; border-radius: 10px;
      padding: 12px 14px; margin-top: 8px;
    }
    .action__label { font-size: 0.78rem; color: #8a6f1c; margin-bottom: 4px; font-weight: 600; }
    .action__body { font-size: 0.92rem; white-space: pre-wrap; color: var(--ink); }
    .action__body--empty { color: var(--muted); font-style: italic; }
    .action__ts { font-size: 0.72rem; color: var(--muted); margin-top: 6px; }
    .actions {
      margin-top: 10px; display: flex; flex-wrap: wrap; gap: 10px;
    }
    .btn {
      display: inline-block; padding: 6px 14px; border-radius: 8px; border: 1px solid var(--line);
      background: var(--paper); color: var(--ink); text-decoration: none; font-size: 0.82rem;
      cursor: pointer;
    }
    .btn:hover { background: var(--wash); }
    .btn--primary { background: var(--green); color: #fff; border-color: var(--green); }
    .btn--primary:hover { background: var(--green-deep); }
    .empty { text-align: center; color: var(--muted); padding: 40px 20px; font-size: 0.9rem; }
    /* モーダル */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 9000;
      display: none; align-items: center; justify-content: center; padding: 16px;
    }
    .modal-backdrop.is-open { display: flex; }
    .modal {
      background: var(--paper); border-radius: 14px; max-width: 480px; width: 100%;
      padding: 20px; max-height: 90vh; overflow: auto; box-shadow: var(--shadow);
    }
    .modal h2 { margin: 0 0 12px; font-size: 1.1rem; color: var(--green-deep); }
    .modal label { display: block; font-size: 0.85rem; margin: 12px 0 4px; color: var(--ink); }
    .modal input[type=text], .modal input[type=password], .modal textarea {
      width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px;
      font-size: 0.92rem; font-family: inherit;
    }
    .modal textarea { min-height: 130px; resize: vertical; }
    .modal__radios { display: flex; gap: 12px; }
    .modal__radios label { display: inline-flex; align-items: center; gap: 6px; margin: 0; font-size: 0.85rem; cursor: pointer; }
    .modal__actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }
    .modal__error { color: var(--coral); font-size: 0.82rem; margin-top: 8px; min-height: 1em; }
    .footer-note {
      text-align: center; padding: 24px 20px; color: var(--muted); font-size: 0.78rem;
    }
  </style>
</head>
<body>
  <header class="header">
    <a href="../index.html"><img class="header__logo" src="../assets/COCoLa_Logo_transparent.png" alt="COCoLa"></a>
    <nav class="header__nav">
      <a href="./index.html">提案・投票</a>
      <a href="../index.html">トップ</a>
    </nav>
  </header>

  <section class="hero">
    <h1>📋 投票結果と処置の記録</h1>
    <p>COCoLa DAOで投票が終了した提案の結果と、その後の実施記録を公開しています。メンバー以外の方もご覧いただけます。</p>
  </section>

  <div class="filters" id="filters">
    <button class="filter-btn is-active" data-filter="all">すべて</button>
    <button class="filter-btn" data-filter="approved">✅ 承認</button>
    <button class="filter-btn" data-filter="rejected">❌ 不採用</button>
    <button class="filter-btn" data-filter="expired">⏳ 期限切れ</button>
  </div>

  <div class="summary" id="summary">読み込み中…</div>

  <main class="list" id="list"></main>

  <div class="footer-note">
    投票結果は GAS 集計→ GitHub Pages（5分ごと自動更新）の流れで反映されます。<br>
    処置の編集は、管理者または提案者本人のみ可能です。
  </div>

  <!-- 編集モーダル -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal">
      <h2 id="modalTitle">処置を編集</h2>
      <p id="modalProposalInfo" style="font-size:0.82rem;color:var(--muted);margin:0 0 8px;"></p>

      <label>認証方式</label>
      <div class="modal__radios">
        <label><input type="radio" name="authType" value="admin" checked> 管理者PW</label>
        <label><input type="radio" name="authType" value="proposer"> 提案者本人</label>
      </div>

      <label id="authInputLabel">パスワード</label>
      <input type="password" id="authInput" placeholder="cocola2026 など">

      <label>処置内容（800文字以内）</label>
      <textarea id="actionInput" maxlength="800" placeholder="実施記録・方針確定・次のアクションなどを記録してください"></textarea>

      <div class="modal__error" id="modalError"></div>

      <div class="modal__actions">
        <button class="btn" id="modalCancel" type="button">キャンセル</button>
        <button class="btn btn--primary" id="modalSave" type="button">保存</button>
      </div>
    </div>
  </div>

  <script>
    var GAS_URL = 'https://script.google.com/macros/s/AKfycbxM2ybpJqfWLL-MPnOwZqeBdHjN6IQh5QB-_LubZAG-bD0x8jLkgbUn7NYRzYLFOPfj7g/exec';
    var STATIC_JSON = './data.json';
    var allProposals = [];
    var currentFilter = 'all';
    var editingId = null;

    function escapeHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function escapeAttr(s) { return escapeHtml(s); }

    function fetchData() {
      return fetch(STATIC_JSON + '?t=' + Date.now())
        .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .catch(function () {
          // フォールバック: GAS 直接
          return fetch(GAS_URL + '?mode=json').then(function (r) { return r.json(); });
        });
    }

    function badgeHtml(statusKey, status) {
      if (statusKey === 'approved') return '<span class="badge badge--approved">✅ ' + escapeHtml(status || '承認') + '</span>';
      if (statusKey === 'rejected') return '<span class="badge badge--rejected">❌ ' + escapeHtml(status || '不採用') + '</span>';
      if (statusKey === 'expired')  return '<span class="badge badge--expired">⏳ ' + escapeHtml(status || '期限切れ') + '</span>';
      return '<span class="badge badge--expired">' + escapeHtml(status || '') + '</span>';
    }

    function progressBar(yesWeight, noWeight) {
      var yes = Number(yesWeight) || 0;
      var no = Number(noWeight) || 0;
      var total = yes + no;
      if (total <= 0) return '<div class="bar-wrap"></div><div class="bar-info">投票なし</div>';
      var yesPct = Math.round((yes / total) * 1000) / 10;
      var noPct = Math.round((no / total) * 1000) / 10;
      return '<div class="bar-wrap" aria-label="協力率 ' + yesPct + '% / 非協力率 ' + noPct + '%">'
        + '<div class="bar-yes" style="width:' + yesPct + '%"></div>'
        + '<div class="bar-no" style="width:' + noPct + '%"></div>'
        + '</div>'
        + '<div class="bar-info">協力 ' + yes + ' / 非協力 ' + no + '（' + yesPct + '% 協力）</div>';
    }

    function actionHtml(p) {
      var note = (p.actionNote || '').trim();
      var ts = (p.actionUpdatedAt || '').trim();
      if (note) {
        return '<div class="action">'
          + '<div class="action__label">📌 その後の処置</div>'
          + '<div class="action__body">' + escapeHtml(note) + '</div>'
          + (ts ? '<div class="action__ts">' + escapeHtml(ts) + ' 更新</div>' : '')
          + '</div>';
      }
      return '<div class="action">'
        + '<div class="action__label">📌 その後の処置</div>'
        + '<div class="action__body action__body--empty">（まだ記録されていません）</div>'
        + '</div>';
    }

    function buildCard(p) {
      var meta = [];
      if (p.proposalTypeLabel) meta.push(escapeHtml(p.proposalTypeLabel));
      if (p.category) meta.push(escapeHtml(p.category));
      if (p.proposer) meta.push('提案者: ' + escapeHtml(p.proposer));
      if (p.deadline) meta.push('締切: ' + escapeHtml(String(p.deadline).slice(0, 10)));
      if (p.decidedAt) meta.push('判定: ' + escapeHtml(p.decidedAt));

      var discussionLink = './index.html#chat-' + encodeURIComponent(p.id || '');
      return '<article class="card" id="card-' + escapeAttr(p.id) + '">'
        + '<div class="card__head">'
        +   '<span class="card__id">' + escapeHtml(p.id) + '</span>'
        +   badgeHtml(p.statusKey, p.status)
        + '</div>'
        + '<h2 class="card__title">' + escapeHtml(p.title) + '</h2>'
        + '<div class="card__meta">' + meta.map(function (m) { return '<span>' + m + '</span>'; }).join('') + '</div>'
        + progressBar(p.yesWeight, p.noWeight)
        + '<div class="bar-info">投票数: ' + (Number(p.voteCount) || 0) + ' 件</div>'
        + actionHtml(p)
        + '<div class="actions">'
        +   '<a class="btn" href="' + discussionLink + '">💬 議論を見る</a>'
        +   '<button class="btn btn--primary" type="button" onclick="openEditModal(\'' + encodeURIComponent(p.id) + '\')">✏️ 処置を編集</button>'
        + '</div>'
        + '</article>';
    }

    function applyFilter() {
      var filtered = allProposals.filter(function (p) {
        if (['approved', 'rejected', 'expired'].indexOf(p.statusKey) === -1) return false;
        if (currentFilter === 'all') return true;
        return p.statusKey === currentFilter;
      });
      var summary = document.getElementById('summary');
      summary.textContent = '表示 ' + filtered.length + ' 件 / 終了済み総数 ' + allProposals.filter(function (p) { return ['approved', 'rejected', 'expired'].indexOf(p.statusKey) !== -1; }).length + ' 件';
      var list = document.getElementById('list');
      if (!filtered.length) {
        list.innerHTML = '<div class="empty">該当する終了済み提案はありません。</div>';
        return;
      }
      list.innerHTML = filtered.map(buildCard).join('');
    }

    function loadProposals() {
      var summary = document.getElementById('summary');
      summary.textContent = '読み込み中…';
      fetchData()
        .then(function (data) {
          var proposals = (data && data.proposals) || [];
          allProposals = proposals;
          applyFilter();
        })
        .catch(function (err) {
          summary.textContent = '読み込みエラー: ' + (err && err.message ? err.message : String(err));
        });
    }

    // フィルタタブ
    document.getElementById('filters').addEventListener('click', function (e) {
      var btn = e.target.closest('.filter-btn');
      if (!btn) return;
      document.querySelectorAll('.filter-btn').forEach(function (b) { b.classList.remove('is-active'); });
      btn.classList.add('is-active');
      currentFilter = btn.dataset.filter || 'all';
      applyFilter();
    });

    // 編集モーダル
    function openEditModal(encodedId) {
      var id = decodeURIComponent(encodedId);
      var p = allProposals.find(function (x) { return x.id === id; });
      if (!p) return;
      editingId = id;
      document.getElementById('modalTitle').textContent = '処置を編集: ' + id;
      document.getElementById('modalProposalInfo').textContent = p.title + ' / 提案者: ' + p.proposer;
      document.getElementById('actionInput').value = p.actionNote || '';
      document.getElementById('authInput').value = '';
      document.getElementById('modalError').textContent = '';
      document.querySelector('input[name=authType][value=admin]').checked = true;
      updateAuthInput();
      document.getElementById('modalBackdrop').classList.add('is-open');
    }
    window.openEditModal = openEditModal;

    function closeEditModal() {
      document.getElementById('modalBackdrop').classList.remove('is-open');
      editingId = null;
    }

    function updateAuthInput() {
      var type = document.querySelector('input[name=authType]:checked').value;
      var label = document.getElementById('authInputLabel');
      var input = document.getElementById('authInput');
      if (type === 'admin') {
        label.textContent = 'パスワード';
        input.type = 'password';
        input.placeholder = 'cocola2026';
      } else {
        label.textContent = '提案者ニックネーム（登録時の表記と完全一致）';
        input.type = 'text';
        input.placeholder = '例: ゆう';
      }
    }
    document.querySelectorAll('input[name=authType]').forEach(function (r) {
      r.addEventListener('change', updateAuthInput);
    });

    document.getElementById('modalCancel').addEventListener('click', closeEditModal);
    document.getElementById('modalBackdrop').addEventListener('click', function (e) {
      if (e.target === document.getElementById('modalBackdrop')) closeEditModal();
    });

    document.getElementById('modalSave').addEventListener('click', function () {
      if (!editingId) return;
      var note = document.getElementById('actionInput').value;
      var auth = document.querySelector('input[name=authType]:checked').value;
      var credential = document.getElementById('authInput').value.trim();
      var errorEl = document.getElementById('modalError');
      errorEl.textContent = '';
      if (!credential) {
        errorEl.textContent = (auth === 'admin' ? 'パスワード' : 'ニックネーム') + 'を入力してください';
        return;
      }
      var saveBtn = document.getElementById('modalSave');
      saveBtn.disabled = true;
      var params = 'mode=updateProposalAction&id=' + encodeURIComponent(editingId)
                 + '&actionNote=' + encodeURIComponent(note);
      if (auth === 'admin') params += '&pw=' + encodeURIComponent(credential);
      else                  params += '&proposer=' + encodeURIComponent(credential);
      fetch(GAS_URL + '?' + params)
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (d.ok) {
            closeEditModal();
            var p = allProposals.find(function (x) { return x.id === d.id; });
            if (p) {
              p.actionNote = d.actionNote || '';
              p.actionUpdatedAt = d.actionUpdatedAt || '';
            }
            applyFilter();
            alert('保存しました（GASキャッシュ更新まで最大1分、data.json反映まで最大5分）');
          } else {
            var msg = '保存に失敗しました: ' + (d.error || '不明');
            if (d.error === 'unauthorized') msg = '認証エラー: 管理者PW または提案者ニックネームが一致しません';
            if (d.error === 'too_long') msg = '本文が長すぎます（800文字以内）';
            errorEl.textContent = msg;
          }
        })
        .catch(function (err) {
          errorEl.textContent = '通信エラー: ' + (err && err.message ? err.message : String(err));
        })
        .finally(function () { saveBtn.disabled = false; });
    });

    loadProposals();
  </script>
</body>
</html>
