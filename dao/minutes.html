<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>COCoLa DAO 議事録</title>
  <meta name="description" content="COCoLa DAOの投票結果議事録。IPFSによる改ざん不可能な記録として永久保存されています。">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
      background: #f5f7fa;
      color: #1a1a2e;
      min-height: 100vh;
    }
    header {
      background: linear-gradient(135deg, #1a1a2e 0%, #2d2d44 100%);
      color: #fff;
      padding: 24px 20px 20px;
      text-align: center;
    }
    header h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: 4px; }
    header p { font-size: 0.82rem; color: #aaa; }
    .back-link {
      display: inline-block;
      margin: 16px 20px 0;
      font-size: 0.85rem;
      color: #6c63ff;
      text-decoration: none;
    }
    .back-link:hover { text-decoration: underline; }
    .container { max-width: 720px; margin: 0 auto; padding: 16px 16px 60px; }
    .empty { text-align: center; color: #888; padding: 60px 0; font-size: 0.95rem; }
    .minutes-card {
      background: #fff;
      border-radius: 12px;
      border: 1px solid #e0e0e8;
      margin-bottom: 20px;
      padding: 20px;
      scroll-margin-top: 80px;
    }
    .minutes-card__head {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 12px;
    }
    .minutes-card__id {
      font-size: 0.75rem;
      background: #6c63ff;
      color: #fff;
      border-radius: 4px;
      padding: 2px 7px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .minutes-card__title {
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.4;
    }
    .minutes-card__meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 14px;
    }
    .pill {
      font-size: 0.75rem;
      background: #f0f0f8;
      border-radius: 20px;
      padding: 3px 10px;
      color: #555;
    }
    .pill.approved { background: #e8f5e9; color: #2e7d32; font-weight: 600; }
    .pill.rejected { background: #fce4ec; color: #c62828; }
    .pill.expired  { background: #f5f5f5; color: #888; }
    .pill.voting   { background: #e3f2fd; color: #1565c0; }
    .vote-summary {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 16px;
      background: #f8f8fc;
      border-radius: 8px;
      padding: 12px;
    }
    .vote-summary__item { text-align: center; }
    .vote-summary__value { font-size: 1.1rem; font-weight: 700; color: #6c63ff; display: block; }
    .vote-summary__label { font-size: 0.7rem; color: #888; }
    .ipfs-section {
      border: 1px solid #c8e6c9;
      border-radius: 8px;
      background: #f1f8f2;
      padding: 14px;
    }
    .ipfs-section__badge {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
      font-weight: 700;
      color: #2e7d32;
      font-size: 0.9rem;
    }
    .ipfs-section__cid {
      font-size: 0.72rem;
      color: #555;
      word-break: break-all;
      margin-bottom: 10px;
      font-family: monospace;
    }
    .ipfs-section__link {
      display: inline-block;
      background: #2e7d32;
      color: #fff;
      border-radius: 6px;
      padding: 7px 16px;
      font-size: 0.85rem;
      text-decoration: none;
      font-weight: 600;
    }
    .ipfs-section__link:hover { background: #1b5e20; }
    .ipfs-section__note {
      font-size: 0.72rem;
      color: #666;
      margin-top: 8px;
      line-height: 1.5;
    }
    @media (max-width: 480px) {
      .vote-summary { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <header>
    <h1>🔒 COCoLa DAO 議事録</h1>
    <p>IPFSによる改ざん不可能な投票記録</p>
  </header>
  <a class="back-link" href="./index.html">← 提案一覧に戻る</a>
  <div class="container">
    <div id="list"><p class="empty">読み込み中...</p></div>
  </div>

  <script>
    var DATA_URL = 'https://you0810jmsdf.github.io/cocola-site/dao/data.json';

    function statusLabel(s) {
      if (s === 'approved') return { text: '承認', cls: 'approved' };
      if (s === 'rejected') return { text: '不採用', cls: 'rejected' };
      if (s === 'expired')  return { text: '期限切れ', cls: 'expired' };
      return { text: '投票中', cls: 'voting' };
    }

    function escHtml(s) {
      return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function cidFromUrl(url) {
      var m = url.match(/ipfs\/([A-Za-z0-9]+)/);
      return m ? m[1] : url;
    }

    fetch(DATA_URL + '?t=' + Date.now())
      .then(function(r) { return r.json(); })
      .then(function(data) {
        var proposals = (data.proposals || []).filter(function(p) { return p.ipfsUrl; });
        var list = document.getElementById('list');

        if (proposals.length === 0) {
          list.innerHTML = '<p class="empty">IPFS保存済みの議事録はまだありません。</p>';
          return;
        }

        var hash = location.hash.replace('#','');

        list.innerHTML = proposals.map(function(p) {
          var st = statusLabel(p.statusKey);
          var cid = cidFromUrl(p.ipfsUrl);
          return '<div class="minutes-card" id="' + escHtml(p.id) + '">' +
            '<div class="minutes-card__head">' +
              '<span class="minutes-card__id">' + escHtml(p.id) + '</span>' +
              '<span class="minutes-card__title">' + escHtml(p.title) + '</span>' +
            '</div>' +
            '<div class="minutes-card__meta">' +
              '<span class="pill ' + st.cls + '">' + st.text + '</span>' +
              '<span class="pill">' + escHtml(p.category) + '</span>' +
              '<span class="pill">提案者: ' + escHtml(p.proposer) + '</span>' +
              (p.decidedAt ? '<span class="pill">確定日: ' + escHtml(p.decidedAt) + '</span>' : '') +
            '</div>' +
            '<div class="vote-summary">' +
              '<div class="vote-summary__item"><span class="vote-summary__value">' + (p.voteCount || 0) + '</span><span class="vote-summary__label">投票数</span></div>' +
              '<div class="vote-summary__item"><span class="vote-summary__value">' + (p.yesRate || 0) + '%</span><span class="vote-summary__label">協力率</span></div>' +
              '<div class="vote-summary__item"><span class="vote-summary__value">' + (p.yesWeight || 0) + '</span><span class="vote-summary__label">協力重み</span></div>' +
              '<div class="vote-summary__item"><span class="vote-summary__value">' + (p.noWeight || 0) + '</span><span class="vote-summary__label">非協力重み</span></div>' +
            '</div>' +
            '<div class="ipfs-section">' +
              '<div class="ipfs-section__badge">🔒 IPFS証明済み</div>' +
              '<div class="ipfs-section__cid">CID: ' + escHtml(cid) + '</div>' +
              '<a class="ipfs-section__link" href="' + escHtml(p.ipfsUrl) + '" target="_blank" rel="noopener">IPFSで検証する ↗</a>' +
              '<p class="ipfs-section__note">このリンクが存在する限り、上記の投票結果は改ざん不可能な記録として世界中のIPFSネットワークに永久保存されています。</p>' +
            '</div>' +
          '</div>';
        }).join('');

        if (hash) {
          var el = document.getElementById(hash);
          if (el) setTimeout(function() { el.scrollIntoView({ behavior: 'smooth' }); }, 100);
        }
      })
      .catch(function() {
        document.getElementById('list').innerHTML = '<p class="empty">データの読み込みに失敗しました。</p>';
      });
  </script>
</body>
</html>
