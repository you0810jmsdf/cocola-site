<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<title>COCoLa DAO イベント受付</title>
<style>
  :root {
    --green: #1f8a5b;
    --green-d: #166442;
    --bg: #f4f6f5;
    --line: #d9e2dd;
    --ink: #1c2620;
    --muted: #5f6f67;
    --ok: #1f8a5b;
    --warn: #b8860b;
    --err: #c0392b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.6;
    -webkit-text-size-adjust: 100%;
  }
  header {
    background: var(--green);
    color: #fff;
    padding: 14px 16px;
    text-align: center;
  }
  header h1 { margin: 0; font-size: 1.05rem; letter-spacing: .02em; }
  header p { margin: 2px 0 0; font-size: .78rem; opacity: .9; }
  main { max-width: 520px; margin: 0 auto; padding: 16px; }
  .card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 14px;
  }
  label { display: block; font-size: .82rem; color: var(--muted); margin-bottom: 6px; }
  input[type="text"], input[type="password"] {
    width: 100%;
    padding: 12px;
    font-size: 1rem;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: #fff;
  }
  button {
    -webkit-appearance: none;
    appearance: none;
    border: none;
    border-radius: 10px;
    padding: 13px 16px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    width: 100%;
  }
  .btn-primary { background: var(--green); color: #fff; }
  .btn-primary:active { background: var(--green-d); }
  .btn-ghost { background: #eef2f0; color: var(--ink); }
  .btn-row { display: flex; gap: 8px; }
  .btn-row button { width: auto; flex: 1; }
  .event-line {
    display: flex; align-items: center; gap: 8px;
    font-size: .92rem; margin-bottom: 4px;
  }
  .event-line b { color: var(--green-d); }
  .small { font-size: .78rem; color: var(--muted); }
  .scanner {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    background: #000;
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 10px;
  }
  .scanner video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .scanner .frame {
    position: absolute; inset: 14%;
    border: 3px solid rgba(255,255,255,.85);
    border-radius: 14px;
    box-shadow: 0 0 0 9999px rgba(0,0,0,.25);
    pointer-events: none;
  }
  .scanner.idle { display: none; }
  .result {
    border-radius: 12px;
    padding: 16px;
    text-align: center;
    font-weight: 700;
    font-size: 1.05rem;
    margin-bottom: 12px;
    display: none;
  }
  .result.show { display: block; }
  .result.success { background: #e6f4ec; color: var(--ok); border: 1px solid #b6dcc6; }
  .result.already { background: #fbf3df; color: var(--warn); border: 1px solid #ecd9a6; }
  .result.error { background: #fbe9e7; color: var(--err); border: 1px solid #f0c0ba; }
  .result.pending { background: #eef2f0; color: var(--muted); border: 1px solid var(--line); }
  .result .sub { display: block; font-size: .8rem; font-weight: 500; margin-top: 4px; opacity: .85; }
  .count {
    text-align: center; font-size: .85rem; color: var(--muted);
    margin: 6px 0 0;
  }
  .count b { color: var(--green-d); font-size: 1.1rem; }
  .hr { height: 1px; background: var(--line); margin: 14px 0; border: 0; }
  .hidden { display: none !important; }
  .foot { text-align: center; margin-top: 10px; }
  .foot button { width: auto; padding: 8px 14px; font-size: .8rem; }
  .note { font-size: .78rem; color: var(--muted); margin-top: 8px; }
</style>
</head>
<body>
<header>
  <h1>COCoLa DAO イベント受付</h1>
  <p>会員証のQRを読み取ってポイントを付与します</p>
</header>

<main>
  <!-- 受付パスワード -->
  <section class="card" id="gate">
    <label for="staffKey">受付パスワード</label>
    <input type="password" id="staffKey" autocomplete="off" placeholder="スタッフ用パスワード">
    <div style="height:10px"></div>
    <button class="btn-primary" id="gateBtn" type="button">受付を開始する</button>
    <p class="note">パスワードは端末に保存され、次回から省略できます（「終了」で削除）。</p>
  </section>

  <!-- 受付画面 -->
  <section id="app" class="hidden">
    <div class="card">
      <div class="event-line">対象イベント：<b id="eventLabel">（未設定）</b></div>
      <div id="eventInputWrap" class="hidden">
        <label for="eventInput">イベントID（URLで指定がない場合に入力）</label>
        <input type="text" id="eventInput" autocomplete="off" placeholder="例: marche-2026-06">
        <div style="height:8px"></div>
        <button class="btn-ghost" id="eventSetBtn" type="button">このイベントで受付する</button>
      </div>
    </div>

    <div class="card" id="scanCard">
      <div class="result" id="result"></div>

      <div class="scanner idle" id="scanner">
        <video id="video" playsinline muted></video>
        <div class="frame"></div>
      </div>

      <div class="btn-row" id="scanBtns">
        <button class="btn-primary" id="startBtn" type="button">カメラでスキャン</button>
        <button class="btn-ghost hidden" id="stopBtn" type="button">停止</button>
      </div>

      <p class="count">この端末で受付：<b id="countNum">0</b> 件</p>

      <hr class="hr">

      <label for="manualName">手入力で受付（カメラが使えない場合）</label>
      <input type="text" id="manualName" autocomplete="off" placeholder="会員のニックネーム">
      <div style="height:8px"></div>
      <button class="btn-ghost" id="manualBtn" type="button">手入力で付与</button>
    </div>

    <div class="foot">
      <button class="btn-ghost" id="logoutBtn" type="button">終了（パスワードを削除）</button>
    </div>
  </section>
</main>

<script src="../assets/jsqr.min.js"></script>
<script>
(function () {
  'use strict';
  var GAS_URL = 'https://script.google.com/macros/s/AKfycbxM2ybpJqfWLL-MPnOwZqeBdHjN6IQh5QB-_LubZAG-bD0x8jLkgbUn7NYRzYLFOPfj7g/exec';
  var KEY_STORE = 'COCOLA_CHECKIN_KEY';

  var params = new URLSearchParams(location.search);
  var eventId = (params.get('event') || '').trim();

  var $ = function (id) { return document.getElementById(id); };
  var gate = $('gate'), app = $('app');
  var result = $('result'), scanner = $('scanner'), video = $('video');
  var startBtn = $('startBtn'), stopBtn = $('stopBtn');
  var countNum = $('countNum');

  var canvas = document.createElement('canvas');
  var ctx = canvas.getContext('2d', { willReadFrequently: true });

  var stream = null, scanning = false, inFlight = false;
  var lastValue = '', lastAt = 0, count = 0;

  /* ---- 認証ゲート ---- */
  function getKey() { return localStorage.getItem(KEY_STORE) || ''; }
  function setKey(v) { localStorage.setItem(KEY_STORE, v); }
  function clearKey() { localStorage.removeItem(KEY_STORE); }

  function openApp() {
    gate.classList.add('hidden');
    app.classList.remove('hidden');
    setupEvent();
  }
  function openGate() {
    stopScan();
    app.classList.add('hidden');
    gate.classList.remove('hidden');
  }

  $('gateBtn').addEventListener('click', function () {
    var v = ($('staffKey').value || '').trim();
    if (!v) { $('staffKey').focus(); return; }
    setKey(v);
    openApp();
  });
  $('logoutBtn').addEventListener('click', function () {
    clearKey();
    openGate();
  });

  /* ---- イベント設定 ---- */
  function setupEvent() {
    if (eventId) {
      $('eventLabel').textContent = eventId;
      $('eventInputWrap').classList.add('hidden');
    } else {
      $('eventLabel').textContent = '（未設定）';
      $('eventInputWrap').classList.remove('hidden');
    }
  }
  $('eventSetBtn').addEventListener('click', function () {
    var v = ($('eventInput').value || '').trim();
    if (!v) { $('eventInput').focus(); return; }
    eventId = v;
    setupEvent();
  });

  /* ---- 結果表示 ---- */
  function showResult(type, msg, sub) {
    result.className = 'result show ' + type;
    result.innerHTML = msg + (sub ? '<span class="sub">' + sub + '</span>' : '');
  }
  function updateCount() { countNum.textContent = String(count); }

  /* ---- 送信 ---- */
  function submit(nickname) {
    nickname = (nickname || '').trim();
    if (!nickname) return;
    if (!eventId) { showResult('error', 'イベントIDを設定してください。'); return; }
    if (inFlight) return;
    inFlight = true;
    showResult('pending', '送信中…', nickname + ' さん');
    var url = GAS_URL + '?mode=checkin'
      + '&member=' + encodeURIComponent(nickname)
      + '&event=' + encodeURIComponent(eventId)
      + '&key=' + encodeURIComponent(getKey())
      + '&t=' + Date.now();
    fetch(url, { method: 'GET' })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        inFlight = false;
        if (res && res.ok && res.awarded) {
          count += 1; updateCount();
          showResult('success', '✓ ' + res.message, '対象: ' + res.event);
        } else if (res && res.ok && res.already) {
          showResult('already', '⚠ ' + res.message);
        } else {
          var m = (res && res.message) || 'エラーが発生しました。';
          showResult('error', '× ' + m);
          if (res && res.error === 'auth') { setTimeout(openGate, 1200); }
        }
      })
      .catch(function () {
        inFlight = false;
        showResult('error', '× 通信に失敗しました。電波をご確認ください。');
      });
  }

  /* ---- 手入力 ---- */
  $('manualBtn').addEventListener('click', function () {
    submit($('manualName').value);
    $('manualName').value = '';
  });

  /* ---- カメラスキャン ---- */
  function handleScan(value) {
    var now = Date.now();
    if (value === lastValue && (now - lastAt) < 4000) return; // 同一QRの連続読みを抑止
    lastValue = value; lastAt = now;
    submit(value);
  }

  function tick() {
    if (!scanning) return;
    if (video.readyState === video.HAVE_ENOUGH_DATA && video.videoWidth) {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      try {
        var img = ctx.getImageData(0, 0, canvas.width, canvas.height);
        var code = jsQR(img.data, img.width, img.height, { inversionAttempts: 'dontInvert' });
        if (code && code.data) handleScan(code.data.trim());
      } catch (e) { /* getImageData が稀に失敗するフレームは無視 */ }
    }
    requestAnimationFrame(tick);
  }

  function startScan() {
    if (!eventId) { showResult('error', '先にイベントIDを設定してください。'); return; }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showResult('error', 'この端末ではカメラを使えません。手入力をご利用ください。');
      return;
    }
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false })
      .then(function (s) {
        stream = s;
        video.srcObject = s;
        video.setAttribute('playsinline', '');
        return video.play();
      })
      .then(function () {
        scanning = true;
        scanner.classList.remove('idle');
        startBtn.classList.add('hidden');
        stopBtn.classList.remove('hidden');
        requestAnimationFrame(tick);
      })
      .catch(function () {
        showResult('error', 'カメラを起動できませんでした。権限を許可するか、手入力をご利用ください。');
      });
  }

  function stopScan() {
    scanning = false;
    if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
    video.srcObject = null;
    scanner.classList.add('idle');
    startBtn.classList.remove('hidden');
    stopBtn.classList.add('hidden');
  }

  startBtn.addEventListener('click', startScan);
  stopBtn.addEventListener('click', stopScan);
  window.addEventListener('pagehide', stopScan);

  /* ---- 起動 ---- */
  if (getKey()) { openApp(); } else { openGate(); }
})();
</script>
</body>
</html>
