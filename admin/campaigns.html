<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>グッズ交換キャンペーン管理 | COCoLa</title>
<style>
  :root {
    --primary: #2e7d57;
    --bg: #f5f7f5;
    --ok: #2e7d32;
    --ng: #c62828;
    --warn: #e08e00;
    --muted: #777;
    --border: #d4dad6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: #222;
    padding: 16px;
    max-width: 680px;
    margin: 0 auto;
  }
  h1 { font-size: 1.25rem; color: var(--primary); margin: 0 0 4px; }
  .sub { font-size: 0.8rem; color: var(--muted); margin: 0 0 16px; }
  .card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 16px;
  }
  label { display: block; font-size: 0.85rem; color: #555; margin: 10px 0 4px; }
  input[type="text"], input[type="number"], input[type="date"], input[type="password"], textarea {
    width: 100%;
    padding: 10px;
    font-size: 1rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #fff;
    font-family: inherit;
  }
  textarea { min-height: 56px; resize: vertical; }
  .row2 { display: flex; gap: 10px; }
  .row2 > div { flex: 1; }
  button {
    padding: 12px 16px;
    font-size: 1rem;
    border: none;
    border-radius: 8px;
    background: var(--primary);
    color: #fff;
    cursor: pointer;
  }
  button.full { width: 100%; margin-top: 14px; }
  button.mini {
    padding: 6px 12px;
    font-size: 0.82rem;
    border-radius: 6px;
  }
  button.secondary { background: #888; }
  button.danger { background: var(--ng); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ログイン */
  #login { max-width: 360px; margin: 60px auto; }
  #loginError { color: var(--ng); font-size: 0.85rem; margin-top: 8px; min-height: 1.2em; }

  /* キャンペーン一覧 */
  .camp {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 12px;
  }
  .camp__head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }
  .camp__name { font-weight: 700; font-size: 1.02rem; }
  .camp__id { font-size: 0.72rem; color: var(--muted); margin-top: 2px; word-break: break-all; }
  .badge {
    font-size: 0.72rem;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .badge--active { background: #e8f5e9; color: var(--ok); }
  .badge--before { background: #e8eeff; color: #3a4cb5; }
  .badge--ended  { background: #f0f0f0; color: #777; }
  .badge--off    { background: #ffebee; color: var(--ng); }
  .camp__meta { font-size: 0.85rem; color: #555; margin: 8px 0; line-height: 1.6; }
  .camp__count { font-weight: 700; color: var(--primary); }
  .camp__actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .empty { color: var(--muted); text-align: center; padding: 20px 0; }
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: #333; color: #fff; padding: 10px 18px; border-radius: 8px;
    font-size: 0.9rem; opacity: 0; transition: opacity .2s; pointer-events: none;
    z-index: 50;
  }
  .toast.show { opacity: 1; }
  .nav-back { font-size: 0.85rem; }
  .nav-back a { color: var(--primary); }
</style>
</head>
<body>

<!-- ログイン画面 -->
<div id="login" class="card">
  <h1>🔒 キャンペーン管理</h1>
  <p class="sub">運営パスワードを入力してください。</p>
  <input type="password" id="pw" placeholder="パスワード" autocomplete="current-password">
  <button class="full" id="loginBtn">ログイン</button>
  <div id="loginError"></div>
</div>

<!-- 管理画面本体 -->
<div id="app" hidden>
  <p class="nav-back"><a href="./index.html">← 運営管理画面に戻る</a></p>
  <h1>🎁 グッズ交換キャンペーン管理</h1>
  <p class="sub">マイページ提示でグッズ交換できるキャンペーンを登録・管理します。</p>

  <!-- 新規登録 -->
  <div class="card">
    <h2 style="font-size:1rem;margin:0 0 4px;">新規キャンペーン登録</h2>
    <label for="cName">キャンペーン名 <span style="color:var(--ng)">*</span></label>
    <input type="text" id="cName" placeholder="例：2026夏 エコバッグ配布">
    <div class="row2">
      <div>
        <label for="cStart">開始日（空欄=今日から）</label>
        <input type="date" id="cStart">
      </div>
      <div>
        <label for="cEnd">終了日（空欄=無期限）</label>
        <input type="date" id="cEnd">
      </div>
    </div>
    <label for="cMax">1人あたり交換回数</label>
    <input type="number" id="cMax" value="1" min="1" max="99">
    <label for="cNote">メモ（任意）</label>
    <textarea id="cNote" placeholder="配布物・場所など"></textarea>
    <button class="full" id="addBtn">＋ このキャンペーンを登録</button>
  </div>

  <!-- 一覧 -->
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:baseline;">
      <h2 style="font-size:1rem;margin:0;">登録済みキャンペーン</h2>
      <button class="mini secondary" id="reloadBtn">🔄 更新</button>
    </div>
    <div id="list" style="margin-top:12px;"><div class="empty">読み込み中…</div></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
(function () {
  var GAS_URL = 'https://script.google.com/macros/s/AKfycbzVs_W57Iphxcc5PHShXBNae63CKqjF5fB82tUkQwaf1vyuNWWLgtWZgglY7Qbuuft1/exec';
  var PASSWORD = 'cocola2026';
  var SESSION_KEY = 'COCOLA_ADMIN_CAMP_AUTH';

  // ===== DOM =====
  var $login = document.getElementById('login');
  var $app = document.getElementById('app');
  var $pw = document.getElementById('pw');
  var $loginBtn = document.getElementById('loginBtn');
  var $loginError = document.getElementById('loginError');
  var $list = document.getElementById('list');
  var $toast = document.getElementById('toast');

  // ===== 認証（セッション内のみ保持） =====
  function isLoggedIn() {
    try { return sessionStorage.getItem(SESSION_KEY) === '1'; } catch (e) { return false; }
  }
  function setLoggedIn() {
    try { sessionStorage.setItem(SESSION_KEY, '1'); } catch (e) {}
  }
  function showApp() {
    $login.hidden = true;
    $app.hidden = false;
    loadList();
  }
  function doLogin() {
    if ($pw.value === PASSWORD) {
      setLoggedIn();
      $pw.value = '';
      showApp();
    } else {
      $loginError.textContent = 'パスワードが違います。';
    }
  }
  $loginBtn.addEventListener('click', doLogin);
  $pw.addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
  if (isLoggedIn()) showApp();

  // ===== トースト =====
  var toastTimer = null;
  function toast(msg) {
    $toast.textContent = msg;
    $toast.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { $toast.classList.remove('show'); }, 2200);
  }

  // ===== 登録 =====
  var $addBtn = document.getElementById('addBtn');
  $addBtn.addEventListener('click', function () {
    var name = document.getElementById('cName').value.trim();
    if (!name) { toast('キャンペーン名を入力してください'); return; }
    var start = document.getElementById('cStart').value; // YYYY-MM-DD or ''
    var end = document.getElementById('cEnd').value;
    var max = parseInt(document.getElementById('cMax').value, 10) || 1;
    var note = document.getElementById('cNote').value.trim();
    $addBtn.disabled = true;
    $addBtn.textContent = '登録中…';
    var url = GAS_URL + '?mode=addCampaign&key=' + encodeURIComponent(PASSWORD) +
      '&name=' + encodeURIComponent(name) +
      '&startDate=' + encodeURIComponent(start) +
      '&endDate=' + encodeURIComponent(end) +
      '&maxPerMember=' + encodeURIComponent(max) +
      '&note=' + encodeURIComponent(note) +
      '&t=' + Date.now();
    fetch(url).then(function (r) { return r.json(); }).then(function (res) {
      if (res && res.ok) {
        toast('登録しました：' + name);
        document.getElementById('cName').value = '';
        document.getElementById('cStart').value = '';
        document.getElementById('cEnd').value = '';
        document.getElementById('cMax').value = '1';
        document.getElementById('cNote').value = '';
        setTimeout(loadList, 900); // GASの書込反映ラグを待つ
      } else {
        toast('登録失敗：' + ((res && (res.message || res.error)) || '不明'));
      }
    }).catch(function () { toast('通信エラー'); })
      .finally(function () { $addBtn.disabled = false; $addBtn.textContent = '＋ このキャンペーンを登録'; });
  });

  // ===== 一覧読込 =====
  document.getElementById('reloadBtn').addEventListener('click', loadList);
  function loadList() {
    $list.innerHTML = '<div class="empty">読み込み中…</div>';
    fetch(GAS_URL + '?mode=listAllCampaigns&key=' + encodeURIComponent(PASSWORD) + '&t=' + Date.now())
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (!res || !res.ok) { $list.innerHTML = '<div class="empty">取得に失敗しました。</div>'; return; }
        if (!res.items.length) { $list.innerHTML = '<div class="empty">まだキャンペーンがありません。上のフォームから登録してください。</div>'; return; }
        $list.innerHTML = res.items.map(renderCamp).join('');
      })
      .catch(function () { $list.innerHTML = '<div class="empty">通信エラー。</div>'; });
  }

  function badgeFor(status) {
    if (status === 'アクティブ') return '<span class="badge badge--active">公開中</span>';
    if (status === '開始前')   return '<span class="badge badge--before">開始前</span>';
    if (status === '終了')     return '<span class="badge badge--ended">終了</span>';
    return '<span class="badge badge--off">無効</span>';
  }
  function renderCamp(c) {
    var period = (c.startDate || '開始未指定') + ' 〜 ' + (c.endDate || '無期限');
    return '' +
      '<div class="camp">' +
        '<div class="camp__head">' +
          '<div>' +
            '<div class="camp__name">' + esc(c.name) + '</div>' +
            '<div class="camp__id">' + esc(c.campaignId) + '</div>' +
          '</div>' +
          badgeFor(c.status) +
        '</div>' +
        '<div class="camp__meta">' +
          '📅 ' + esc(period) + '<br>' +
          '🎫 1人' + esc(c.maxPerMember) + '回まで　/　' +
          '<span class="camp__count">🎁 配布 ' + esc(c.redeemedCount) + ' 名</span>' +
          (c.note ? '<br>📝 ' + esc(c.note) : '') +
        '</div>' +
        '<div class="camp__actions">' +
          (c.active
            ? '<button class="mini secondary" onclick="window._toggle(\'' + esc(c.campaignId) + '\',false)">⏸ 無効化</button>'
            : '<button class="mini" onclick="window._toggle(\'' + esc(c.campaignId) + '\',true)">▶ 有効化</button>') +
          '<button class="mini danger" onclick="window._del(\'' + esc(c.campaignId) + '\',\'' + esc(c.name) + '\',' + c.redeemedCount + ')">🗑 削除</button>' +
        '</div>' +
      '</div>';
  }

  // ===== 有効無効切替 =====
  window._toggle = function (campaignId, active) {
    fetch(GAS_URL + '?mode=setCampaignActive&key=' + encodeURIComponent(PASSWORD) +
          '&campaignId=' + encodeURIComponent(campaignId) +
          '&active=' + (active ? 'true' : 'false') + '&t=' + Date.now())
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (res && res.ok) {
          toast(active ? '有効化しました' : '無効化しました');
          setCardActiveOptimistic(campaignId, active); // 即時反映
          setTimeout(loadList, 1500);                  // 正確な状態で上書き
        }
        else { toast('切替失敗'); }
      }).catch(function () { toast('通信エラー'); });
  };

  // ===== 削除 =====
  window._del = function (campaignId, name, count) {
    var msg = '「' + name + '」を削除しますか？';
    if (count > 0) msg += '\n\n※ ' + count + '名の交換実績があります。\n（交換履歴シートの記録は残ります）';
    if (!confirm(msg)) return;
    fetch(GAS_URL + '?mode=deleteCampaign&key=' + encodeURIComponent(PASSWORD) +
          '&campaignId=' + encodeURIComponent(campaignId) + '&t=' + Date.now())
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (res && res.ok) { toast('削除しました'); removeCardEl(campaignId); setTimeout(loadList, 1500); }
        else { toast('削除失敗'); }
      }).catch(function () { toast('通信エラー'); });
  };

  // ===== 楽観的UI更新（GASの反映ラグに依存せず即時反映） =====
  function findCardEl(campaignId) {
    var cards = document.querySelectorAll('.camp');
    for (var i = 0; i < cards.length; i++) {
      var idEl = cards[i].querySelector('.camp__id');
      if (idEl && idEl.textContent === campaignId) return cards[i];
    }
    return null;
  }
  function removeCardEl(campaignId) {
    var el = findCardEl(campaignId);
    if (el) el.remove();
    if (!document.querySelectorAll('.camp').length) {
      $list.innerHTML = '<div class="empty">まだキャンペーンがありません。上のフォームから登録してください。</div>';
    }
  }
  // 有効/無効をその場でバッジ・ボタンに反映（正確な status は直後の loadList で上書き）
  function setCardActiveOptimistic(campaignId, active) {
    var card = findCardEl(campaignId);
    if (!card) return;
    var badge = card.querySelector('.badge');
    if (badge) {
      badge.className = 'badge ' + (active ? 'badge--active' : 'badge--off');
      badge.textContent = active ? '公開中' : '無効';
    }
    var toggleBtn = card.querySelector('.camp__actions button.mini:not(.danger)');
    if (toggleBtn) {
      if (active) {
        toggleBtn.className = 'mini secondary';
        toggleBtn.textContent = '⏸ 無効化';
        toggleBtn.setAttribute('onclick', "window._toggle('" + campaignId + "',false)");
      } else {
        toggleBtn.className = 'mini';
        toggleBtn.textContent = '▶ 有効化';
        toggleBtn.setAttribute('onclick', "window._toggle('" + campaignId + "',true)");
      }
    }
  }

  // ===== utils =====
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
})();
</script>
</body>
</html>
