<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>管理画面 | COCoLa</title>
  <meta name="theme-color" content="#f3efe3">
  <link rel="icon" type="image/png" href="../assets/COCoLa_Logo_transparent.png">
  <link rel="apple-touch-icon" href="../assets/COCoLa_Logo_BG.png">
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <div class="page-shell">
    <header class="site-header">
      <a class="brand" href="../index.html" aria-label="COCoLa トップへ">
        <img class="brand__logo" src="../assets/COCoLa_Logo_transparent.png" alt="COCoLa ロゴ">
      </a>
      <nav class="site-nav" aria-label="サイトナビゲーション">
        <a href="../index.html">トップ</a>
      </nav>
    </header>

    <main>
      <section class="page-hero page-hero--blue">
        <div class="page-hero__copy">
          <p class="eyebrow">ADMIN</p>
          <h1>運営管理画面</h1>
          <p class="page-hero__lead">COCoLa 運営者用ツールへの入口です。このページは公開ナビゲーションには掲載されていません。</p>
        </div>
      </section>

      <section class="section">
        <div class="section-heading">
          <p class="eyebrow">Threads（@cocola_project）</p>
          <h2>投稿管理</h2>
        </div>
        <div class="apps-grid">
          <article class="app-card">
            <p class="app-card__tag">運営</p>
            <h3>📝 投稿候補一覧</h3>
            <p>毎朝自動生成された Threads 投稿候補を確認・編集・承認できます。</p>
            <div class="app-card__actions">
              <a class="button button--secondary" href="https://script.google.com/macros/s/AKfycbzoBs-QM0J4azPWNOqp6uxxlFSIsHe2r-ecyByq1qkZNcifR22tKiLMEog0SRmTvZ1LLQ/exec?action=drafts" target="_blank" rel="noreferrer noopener">開く</a>
            </div>
          </article>
          <article class="app-card">
            <p class="app-card__tag">運営</p>
            <h3>📰 Web情報キャッシュ</h3>
            <p>投稿生成の参考に使われる Web 情報の最新キャッシュを表示します。</p>
            <div class="app-card__actions">
              <a class="button button--secondary" href="https://script.google.com/macros/s/AKfycbzoBs-QM0J4azPWNOqp6uxxlFSIsHe2r-ecyByq1qkZNcifR22tKiLMEog0SRmTvZ1LLQ/exec?action=cache" target="_blank" rel="noreferrer noopener">開く</a>
            </div>
          </article>
          <article class="app-card">
            <p class="app-card__tag">運営</p>
            <h3>🔑 キーワード管理</h3>
            <p>Web 情報収集に使うキーワードの編集と、即時情報収集の実行ができます。</p>
            <div class="app-card__actions">
              <a class="button button--secondary" href="https://script.google.com/macros/s/AKfycbzoBs-QM0J4azPWNOqp6uxxlFSIsHe2r-ecyByq1qkZNcifR22tKiLMEog0SRmTvZ1LLQ/exec?action=keywords" target="_blank" rel="noreferrer noopener">開く</a>
            </div>
          </article>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <p>COCoLa | ADMIN</p>
      <div class="site-footer__links">
        <a href="../index.html">トップへ戻る</a>
      </div>
    </footer>
  </div>
</body>
</html>
