<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>だんご通信 | COCoLa</title>
  <meta name="description" content="印西市市民活動支援センターから届くメールマガジン「だんご通信」のアーカイブです。">
  <link rel="icon" type="image/png" href="../assets/COCoLa_Logo_transparent.png">
  <style>
    :root {
      --green: #1d9e75;
      --green-light: #e8f6f1;
      --green-dark: #167a5b;
      --text: #333;
      --muted: #777;
      --border: #e0e0e0;
      --bg: #f3efe3;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    .site-header {
      background: #fff;
      border-bottom: 2px solid var(--green);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .site-header__back {
      color: var(--green);
      text-decoration: none;
      font-size: .85rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }
    .site-header__back:hover { color: var(--green-dark); }
    .site-header__title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text);
      flex: 1;
    }
    .page-wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 20px 16px 60px;
    }
    .page-kicker {
      font-size: .75rem;
      color: var(--muted);
      font-weight: 700;
      letter-spacing: .06em;
      margin-bottom: 4px;
    }
    .page-heading {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--green);
      margin-bottom: 6px;
      line-height: 1.3;
    }
    .page-desc {
      font-size: .85rem;
      color: var(--muted);
      margin-bottom: 20px;
      line-height: 1.6;
    }
    .list-status {
      text-align: center;
      padding: 40px 16px;
      color: var(--muted);
      font-size: .9rem;
    }
    .list-status .spinner {
      display: inline-block;
      width: 24px;
      height: 24px;
      border: 3px solid var(--border);
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin-bottom: 10px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .mail-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
    .mail-card {
      background: #fff;
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 16px 18px;
      cursor: pointer;
      transition: box-shadow .15s, border-color .15s;
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }
    .mail-card:hover {
      box-shadow: 0 4px 16px rgba(29,158,117,.12);
      border-color: var(--green);
    }
    .mail-card__icon {
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      background: var(--green-light);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
    }
    .mail-card__body { flex: 1; min-width: 0; }
    .mail-card__date {
      font-size: .75rem;
      color: var(--muted);
      font-weight: 700;
      margin-bottom: 3px;
    }
    .mail-card__subject {
      font-size: .95rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.4;
      margin-bottom: 4px;
      word-break: break-all;
    }
    .mail-card__badge-row { display: flex; gap: 6px; flex-wrap: wrap; }
    .att-badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: .7rem;
      font-weight: 700;
      background: #fff3e0;
      color: #e65100;
      border-radius: 20px;
      padding: 2px 8px;
    }
    .mail-card__arrow {
      color: var(--muted);
      font-size: 1rem;
      align-self: center;
      flex-shrink: 0;
    }

    /* モーダル */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.5);
      z-index: 1000;
      align-items: flex-start;
      justify-content: center;
      overflow-y: auto;
      padding: 20px 12px;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: #fff;
      border-radius: 16px;
      width: min(100%, 680px);
      max-width: 100%;
      box-shadow: 0 8px 40px rgba(0,0,0,.2);
      animation: slideUp .2s ease;
      overflow: hidden;
    }
    @keyframes slideUp { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
    .modal-header {
      padding: 20px 20px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    .modal-header__texts { flex: 1; min-width: 0; }
    .modal-header__date {
      font-size: .78rem;
      color: var(--muted);
      font-weight: 700;
      margin-bottom: 4px;
    }
    .modal-header__subject {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.4;
      word-break: break-all;
    }
    .modal-close-btn {
      flex-shrink: 0;
      background: none;
      border: 1px solid var(--border);
      border-radius: 50%;
      width: 34px;
      height: 34px;
      cursor: pointer;
      font-size: 1.1rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }
    .modal-close-btn:hover { background: var(--bg); }
    .modal-body { padding: 20px; }
    .modal-attachments {
      margin-bottom: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .att-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      background: var(--green-light);
      color: var(--green-dark);
      border-radius: 8px;
      text-decoration: none;
      font-size: .85rem;
      font-weight: 700;
      border: 1px solid rgba(29,158,117,.25);
      transition: background .15s;
    }
    .att-link:hover { background: #d0eddf; }
    .att-link .att-icon { font-size: 1rem; }
    .modal-mail-body {
      background: #fafafa;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      font-size: .88rem;
      line-height: 1.8;
      color: #444;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 60vh;
      overflow-y: auto;
    }
    .no-att { color: var(--muted); font-size: .8rem; }
    .error-msg {
      background: #fff5f5;
      border: 1px solid #fdd;
      border-radius: 8px;
      padding: 16px;
      color: #c00;
      font-size: .88rem;
      text-align: center;
    }
    .refresh-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .refresh-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--green);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 16px;
      font-size: .85rem;
      font-weight: 700;
      cursor: pointer;
      transition: background .15s;
      font-family: inherit;
    }
    .refresh-btn:hover:not(:disabled) { background: var(--green-dark); }
    .refresh-btn:disabled { opacity: .6; cursor: default; }
    .refresh-btn .btn-spinner {
      display: none;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    .refresh-btn.loading .btn-spinner { display: inline-block; }
    .refresh-btn.loading .btn-icon { display: none; }
    .updated-at {
      font-size: .78rem;
      color: var(--muted);
    }
  </style>
</head>
<body>

<header class="site-header">
  <a class="site-header__back" href="../index.html">← COCoLa TOP</a>
  <span class="site-header__title">だんご通信</span>
</header>

<div class="page-wrap">
  <p class="page-kicker">INZAI CITIZEN ACTIVITY CENTER</p>
  <h1 class="page-heading">だんご通信</h1>
  <p class="page-desc">
    印西市市民活動支援センターから毎月届くメールマガジン「だんご通信」のアーカイブです。<br>
    クリックすると内容と添付ファイルを確認できます。
  </p>

  <div class="refresh-row">
    <button class="refresh-btn" id="refresh-btn" onclick="refreshFromGas()">
      <span class="btn-icon">↻</span>
      <span class="btn-spinner"></span>
      最新に更新
    </button>
    <span class="updated-at" id="updated-at"></span>
  </div>

  <div id="list-container">
    <div class="list-status" id="loading">
      <div class="spinner"></div><br>読み込み中…
    </div>
    <ul class="mail-list" id="mail-list" style="display:none"></ul>
    <div class="list-status" id="error-area" style="display:none"></div>
  </div>
</div>

<!-- 詳細モーダル -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-header">
      <div class="modal-header__texts">
        <div class="modal-header__date" id="modal-date"></div>
        <div class="modal-header__subject" id="modal-subject"></div>
      </div>
      <button class="modal-close-btn" id="modal-close" aria-label="閉じる">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-attachments" id="modal-attachments"></div>
      <div class="modal-mail-body" id="modal-body-text"></div>
    </div>
  </div>
</div>

<script>
  var GAS_URL = 'https://script.google.com/macros/s/AKfycbwWAtWkd4KQQVGJvmnhO_bVFZ305WdQxY1kre9mluQpfIsSexK1JfyjnzD4ywJ9i0jB/exec';

(function () {
  // GitHub Pages 上の静的JSON（GitHub Actions が月次更新）
  var DATA_URL = './data.json';

  var loadingEl  = document.getElementById('loading');
  var mailListEl = document.getElementById('mail-list');
  var errorEl    = document.getElementById('error-area');
  var overlay    = document.getElementById('modal-overlay');
  var updatedAtEl = document.getElementById('updated-at');

  function showError(msg) {
    loadingEl.style.display = 'none';
    errorEl.innerHTML = '<div class="error-msg">⚠️ ' + msg + '</div>';
    errorEl.style.display = 'block';
  }

  function setUpdatedAt(label) {
    if (updatedAtEl) updatedAtEl.textContent = label;
  }

  function fetchData() {
    fetch(DATA_URL + '?t=' + Date.now())
      .then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(function (json) {
        var items = Array.isArray(json) ? json : (json.items || []);
        if (!Array.isArray(items)) throw new Error('データ形式が正しくありません');
        if (json._generatedMs) {
          var d = new Date(json._generatedMs);
          setUpdatedAt('キャッシュ更新: ' + d.toLocaleDateString('ja-JP') + ' ' + d.toLocaleTimeString('ja-JP', {hour:'2-digit', minute:'2-digit'}));
        }
        render(items);
      })
      .catch(function (err) {
        showError('データを取得できませんでした。しばらく後に再読み込みしてください。(' + err.message + ')');
      });
  }

  window.refreshFromGas = function () {
    var btn = document.getElementById('refresh-btn');
    btn.disabled = true;
    btn.classList.add('loading');
    loadingEl.style.display = 'block';
    mailListEl.style.display = 'none';
    mailListEl.innerHTML = '';
    errorEl.style.display = 'none';
    setUpdatedAt('GASから取得中…');

    // JSONP で呼び出し（GASのCORS制約を回避）
    var cbName = '__dangoCallback_' + Date.now();
    var script = document.createElement('script');
    var timer = setTimeout(function () {
      cleanup();
      btn.disabled = false;
      btn.classList.remove('loading');
      showError('タイムアウトしました。GASが応答していません。');
      setUpdatedAt('');
    }, 30000);

    function cleanup() {
      clearTimeout(timer);
      delete window[cbName];
      if (script.parentNode) script.parentNode.removeChild(script);
    }

    window[cbName] = function (data) {
      cleanup();
      btn.disabled = false;
      btn.classList.remove('loading');
      try {
        var items = Array.isArray(data) ? data : (data.items || []);
        if (!Array.isArray(items)) throw new Error('データ形式が正しくありません');
        var now = new Date();
        setUpdatedAt('GAS取得: ' + now.toLocaleDateString('ja-JP') + ' ' + now.toLocaleTimeString('ja-JP', {hour:'2-digit', minute:'2-digit'}));
        render(items);
      } catch (e) {
        showError('GASのデータ形式が正しくありません。(' + e.message + ')');
        setUpdatedAt('');
      }
    };

    script.onerror = function () {
      cleanup();
      btn.disabled = false;
      btn.classList.remove('loading');
      showError('GASへの接続に失敗しました。');
      setUpdatedAt('');
    };

    script.src = GAS_URL + '?mode=dangotsusin&callback=' + cbName + '&t=' + Date.now();
    document.head.appendChild(script);
  };

  function attIcon(mimeType) {
    if (!mimeType) return '📎';
    if (mimeType.indexOf('pdf') !== -1) return '📄';
    if (mimeType.indexOf('image') !== -1) return '🖼️';
    if (mimeType.indexOf('word') !== -1 || mimeType.indexOf('document') !== -1) return '📝';
    if (mimeType.indexOf('sheet') !== -1 || mimeType.indexOf('excel') !== -1) return '📊';
    return '📎';
  }

  function render(items) {
    loadingEl.style.display = 'none';
    if (items.length === 0) {
      errorEl.textContent = 'メールが見つかりませんでした。';
      errorEl.style.display = 'block';
      return;
    }
    items.forEach(function (item) {
      var li = document.createElement('li');
      var attBadges = (item.attachments || []).map(function (a) {
        return '<span class="att-badge">' + attIcon(a.mimeType) + ' ' + a.name + '</span>';
      }).join('');
      li.innerHTML =
        '<div class="mail-card" tabindex="0" role="button">' +
          '<div class="mail-card__icon">📰</div>' +
          '<div class="mail-card__body">' +
            '<div class="mail-card__date">' + item.date + '</div>' +
            '<div class="mail-card__subject">' + escHtml(item.subject) + '</div>' +
            '<div class="mail-card__badge-row">' + (attBadges || '<span class="no-att">添付なし</span>') + '</div>' +
          '</div>' +
          '<span class="mail-card__arrow">›</span>' +
        '</div>';
      li.querySelector('.mail-card').addEventListener('click', function () { openModal(item); });
      li.querySelector('.mail-card').addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openModal(item); }
      });
      mailListEl.appendChild(li);
    });
    mailListEl.style.display = 'flex';
  }

  function openModal(item) {
    document.getElementById('modal-date').textContent = item.date;
    document.getElementById('modal-subject').textContent = item.subject;
    document.getElementById('modal-body-text').textContent = item.body || '（本文なし）';
    var attEl = document.getElementById('modal-attachments');
    attEl.innerHTML = '';
    if (item.attachments && item.attachments.length > 0) {
      item.attachments.forEach(function (a) {
        var link = document.createElement('a');
        link.href = a.url;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.className = 'att-link';
        link.innerHTML = '<span class="att-icon">' + attIcon(a.mimeType) + '</span>' + escHtml(a.name) + '　↗';
        attEl.appendChild(link);
      });
    } else {
      attEl.innerHTML = '<span class="no-att">添付ファイルなし</span>';
    }
    overlay.classList.add('open');
    document.body.style.overflow = 'hidden';
    document.getElementById('modal-close').focus();
  }

  function closeModal() {
    overlay.classList.remove('open');
    document.body.style.overflow = '';
  }

  document.getElementById('modal-close').addEventListener('click', closeModal);
  overlay.addEventListener('click', function (e) { if (e.target === overlay) closeModal(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(); });

  function escHtml(str) {
    return String(str || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  fetchData();
})();
</script>
</body>
</html>
