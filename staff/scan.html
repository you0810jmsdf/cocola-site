<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>COCoLa スタッフ用 QRスキャナ</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root {
    --primary: #2e7d57;
    --bg: #f5f7f5;
    --ok: #2e7d32;
    --ng: #c62828;
    --warn: #e08e00;
    --border: #d4dad6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: #222;
    padding: 16px;
    max-width: 560px;
    margin: 0 auto;
  }
  h1 {
    font-size: 1.2rem;
    margin: 0 0 12px;
    color: var(--primary);
  }
  .card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 14px;
  }
  label {
    display: block;
    font-size: 0.85rem;
    color: #555;
    margin-bottom: 4px;
  }
  select, input[type="text"] {
    width: 100%;
    padding: 10px;
    font-size: 1rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #fff;
    margin-bottom: 10px;
  }
  button {
    width: 100%;
    padding: 12px;
    font-size: 1rem;
    border: none;
    border-radius: 8px;
    background: var(--primary);
    color: #fff;
    cursor: pointer;
    margin-bottom: 8px;
  }
  button.secondary {
    background: #888;
  }
  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  #reader {
    width: 100%;
    margin: 8px 0;
    border-radius: 8px;
    overflow: hidden;
    background: #000;
  }
  #reader video { max-width: 100%; }
  .result {
    padding: 14px;
    border-radius: 8px;
    margin-top: 10px;
    font-size: 1rem;
    line-height: 1.6;
  }
  .result.ok    { background: #e8f5e9; border-left: 6px solid var(--ok); }
  .result.ng    { background: #ffebee; border-left: 6px solid var(--ng); }
  .result.warn  { background: #fff8e1; border-left: 6px solid var(--warn); }
  .result b { display: block; font-size: 1.15rem; margin-bottom: 4px; }
  .result .sub { font-size: 0.85rem; color: #555; }
  #scanLog {
    font-size: 0.8rem;
    color: #666;
    margin-top: 12px;
    max-height: 200px;
    overflow-y: auto;
    border-top: 1px solid var(--border);
    padding-top: 8px;
  }
  #scanLog div { padding: 4px 0; border-bottom: 1px dashed #eee; }
  .auth-error {
    color: var(--ng);
    padding: 14px;
    background: #ffebee;
    border-radius: 8px;
  }
  .footer-note {
    font-size: 0.75rem;
    color: #888;
    text-align: center;
    margin-top: 20px;
  }
  /* 配布人数カウンター */
  .dist-counter {
    display: flex;
    align-items: baseline;
    gap: 6px;
    background: var(--primary);
    color: #fff;
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .dist-label { font-size: 0.95rem; font-weight: 600; }
  .dist-number { font-size: 2rem; font-weight: 800; line-height: 1; }
  .dist-unit { font-size: 0.95rem; }
  .dist-updated {
    margin-left: auto;
    font-size: 0.7rem;
    opacity: 0.8;
    align-self: flex-end;
  }
  /* タブ */
  .tabbar {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }
  .tab {
    flex: 1;
    padding: 10px;
    font-size: 0.95rem;
    background: #fff;
    color: var(--primary);
    border: 1px solid var(--primary);
    border-radius: 8px;
    margin: 0;
  }
  .tab.is-active {
    background: var(--primary);
    color: #fff;
  }
  /* 履歴 */
  .history-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 4px;
  }
  .history-head span:first-child { font-weight: 700; }
  .history-count {
    font-size: 0.9rem;
    color: var(--primary);
    font-weight: 700;
  }
  .history-updated {
    font-size: 0.75rem;
    color: #999;
    margin-bottom: 8px;
  }
  .history-list {
    margin-top: 10px;
    max-height: 60vh;
    overflow-y: auto;
  }
  .history-row {
    display: flex;
    justify-content: space-between;
    padding: 8px 4px;
    border-bottom: 1px solid #eee;
    font-size: 0.9rem;
  }
  .history-row .hr-name { font-weight: 600; }
  .history-row .hr-meta { color: #888; font-size: 0.8rem; }
  .history-empty {
    color: #999;
    text-align: center;
    padding: 24px 0;
    font-size: 0.9rem;
  }
</style>
</head>
<body>
<h1>📷 COCoLa スタッフ用 QRスキャナ</h1>

<div id="authError" class="auth-error" hidden>
  アクセス権限がありません。スタッフ用URLからアクセスしてください。
</div>

<div id="mainApp" hidden>
  <div class="card">
    <label for="campaignSelect">キャンペーン</label>
    <select id="campaignSelect">
      <option value="">読み込み中…</option>
    </select>
    <label for="staffName">スタッフ名（記録用）</label>
    <input type="text" id="staffName" placeholder="例：山田" autocomplete="off">
  </div>

  <!-- 配布人数カウンター（全タブ共通・常時表示・自動更新） -->
  <div id="distCounter" class="dist-counter">
    <span class="dist-label">🎁 配布済み</span>
    <span id="distNumber" class="dist-number">―</span>
    <span class="dist-unit">名</span>
    <span id="distUpdated" class="dist-updated"></span>
  </div>

  <div class="tabbar">
    <button class="tab is-active" data-tab="scan">📷 スキャン</button>
    <button class="tab" data-tab="history">📋 履歴</button>
  </div>

  <!-- スキャンタブ -->
  <div class="tabview" data-view="scan">
    <div class="card">
      <button id="startBtn">📷 スキャン開始</button>
      <button id="stopBtn" class="secondary" hidden>停止</button>
      <div id="reader"></div>
      <div id="result"></div>
    </div>

    <div class="card">
      <div style="font-size:0.85rem;color:#555;margin-bottom:6px;">スキャン履歴（この端末・このセッション内のみ）</div>
      <div id="scanLog"></div>
    </div>
  </div>

  <!-- 履歴タブ（全スタッフ共有・サーバ記録） -->
  <div class="tabview" data-view="history" hidden>
    <div class="card">
      <div class="history-head">
        <span id="historyTitle">交換履歴</span>
        <span id="historyCount" class="history-count">―</span>
      </div>
      <div id="historyUpdated" class="history-updated"></div>
      <button id="historyRefresh" class="secondary">🔄 今すぐ更新</button>
      <div id="historyList" class="history-list"></div>
    </div>
    <div class="footer-note">
      全スタッフの交換が10秒ごとに自動反映されます（同じ記録シートを共有）。
    </div>
  </div>

  <div class="footer-note">
    QRは COCOLA-{12文字} 形式。重複防止はサーバ側で自動チェック。
  </div>
</div>

<script>
(function () {
  // ===== 設定 =====
  var GAS_URL = 'https://script.google.com/macros/s/AKfycbzVs_W57Iphxcc5PHShXBNae63CKqjF5fB82tUkQwaf1vyuNWWLgtWZgglY7Qbuuft1/exec';
  var REQUIRED_KEY = 'cocola2026';

  // ===== URLパラメータ認証 =====
  var params = new URLSearchParams(location.search);
  var key = params.get('key') || '';
  if (key !== REQUIRED_KEY) {
    document.getElementById('authError').hidden = false;
    return;
  }
  document.getElementById('mainApp').hidden = false;

  // ===== DOM =====
  var $sel = document.getElementById('campaignSelect');
  var $staff = document.getElementById('staffName');
  var $start = document.getElementById('startBtn');
  var $stop = document.getElementById('stopBtn');
  var $result = document.getElementById('result');
  var $log = document.getElementById('scanLog');
  var $historyList = document.getElementById('historyList');
  var $historyCount = document.getElementById('historyCount');
  var $historyTitle = document.getElementById('historyTitle');
  var $historyUpdated = document.getElementById('historyUpdated');
  var $historyRefresh = document.getElementById('historyRefresh');
  var $distNumber = document.getElementById('distNumber');
  var $distUpdated = document.getElementById('distUpdated');

  // ===== state =====
  var scanner = null;
  var scanning = false;
  var lastDecodedAt = 0;
  var lastDecodedText = '';
  var pollTimer = null;
  var activeTab = 'scan';

  // ===== スタッフ名復元 =====
  try {
    var savedStaff = localStorage.getItem('COCOLA_STAFF_NAME') || '';
    if (savedStaff) $staff.value = savedStaff;
  } catch (e) {}
  $staff.addEventListener('change', function () {
    try { localStorage.setItem('COCOLA_STAFF_NAME', $staff.value || ''); } catch (e) {}
  });

  // ===== キャンペーン一覧読込 =====
  function loadCampaigns() {
    fetch(GAS_URL + '?mode=listCampaigns&key=' + encodeURIComponent(REQUIRED_KEY) + '&t=' + Date.now())
      .then(function (r) { return r.json(); })
      .then(function (res) {
        $sel.innerHTML = '';
        if (!res || !res.ok || !res.items || !res.items.length) {
          var opt = document.createElement('option');
          opt.value = '';
          opt.textContent = 'アクティブなキャンペーンがありません';
          $sel.appendChild(opt);
          return;
        }
        var first = document.createElement('option');
        first.value = '';
        first.textContent = '― 選択してください ―';
        $sel.appendChild(first);
        res.items.forEach(function (c) {
          var o = document.createElement('option');
          o.value = c.campaignId;
          o.textContent = c.name + ' (' + c.campaignId + ')';
          $sel.appendChild(o);
        });
        // 直前選択を復元
        try {
          var saved = localStorage.getItem('COCOLA_LAST_CAMPAIGN') || '';
          if (saved) $sel.value = saved;
        } catch (e) {}
        // キャンペーン確定後、配布人数を即取得
        loadData();
      })
      .catch(function () {
        $sel.innerHTML = '<option value="">通信エラー</option>';
      });
  }
  $sel.addEventListener('change', function () {
    try { localStorage.setItem('COCOLA_LAST_CAMPAIGN', $sel.value || ''); } catch (e) {}
  });
  loadCampaigns();
  startPolling(); // 配布人数カウンターを常時自動更新

  // ===== スキャナ起動 =====
  $start.addEventListener('click', function () {
    if (!$sel.value) {
      alert('キャンペーンを選択してください。');
      return;
    }
    if (!$staff.value.trim()) {
      if (!confirm('スタッフ名が未入力です。このまま進めますか？')) return;
    }
    startScan();
  });

  $stop.addEventListener('click', stopScan);

  function startScan() {
    if (scanning) return;
    scanner = new Html5Qrcode('reader');
    scanner.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: { width: 240, height: 240 } },
      onDecoded,
      function () { /* per-frame error → 無視 */ }
    ).then(function () {
      scanning = true;
      $start.hidden = true;
      $stop.hidden = false;
    }).catch(function (err) {
      showResult('ng', 'カメラを起動できません', String(err && err.message || err));
    });
  }

  function stopScan() {
    if (!scanner || !scanning) return;
    scanner.stop().then(function () {
      scanner.clear();
      scanning = false;
      $start.hidden = false;
      $stop.hidden = true;
    });
  }

  // ===== スキャン成功 =====
  function onDecoded(decodedText) {
    var now = Date.now();
    // 連続発火対策：同じ文字列が2秒以内なら無視
    if (decodedText === lastDecodedText && now - lastDecodedAt < 2000) return;
    lastDecodedText = decodedText;
    lastDecodedAt = now;

    var memberId = String(decodedText || '').trim();
    if (memberId.indexOf('COCOLA-') !== 0) {
      showResult('warn', '対象外のQR', '内容: ' + memberId);
      return;
    }
    sendRedeem(memberId);
  }

  // ===== GAS 呼び出し =====
  function sendRedeem(memberId) {
    showResult('warn', '送信中…', memberId);
    var url = GAS_URL +
      '?mode=redeemGoods' +
      '&key=' + encodeURIComponent(REQUIRED_KEY) +
      '&memberId=' + encodeURIComponent(memberId) +
      '&campaignId=' + encodeURIComponent($sel.value) +
      '&staff=' + encodeURIComponent($staff.value.trim()) +
      '&t=' + now();
    fetch(url)
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (res && res.ok) {
          showResult('ok',
            '✅ ' + (res.nickname || '') + 'さん 交換OK',
            res.campaignName || ''
          );
          addLog('ok', memberId, res);
          // 自分の交換を配布人数・履歴へ即反映（他スタッフ分は10秒ポーリングで届く）
          loadData();
        } else if (res && res.error === 'already_redeemed') {
          showResult('ng',
            '⚠️ 既に交換済み',
            (res.nickname || '') + ' / ' + (res.lastRedeemedAt || '') +
            (res.lastStaff ? '（担当：' + res.lastStaff + '）' : '')
          );
          addLog('ng', memberId, res);
        } else if (res && res.error === 'member_not_found') {
          showResult('ng', '❌ メンバーが見つかりません', memberId);
          addLog('ng', memberId, res);
        } else if (res && res.error === 'campaign_not_active') {
          showResult('ng', '❌ キャンペーン無効/期間外', $sel.value);
        } else {
          showResult('ng', '❌ エラー', (res && (res.error || res.message)) || '不明');
        }
      })
      .catch(function (err) {
        showResult('ng', '通信エラー', String(err && err.message || err));
      });
  }

  // ===== 表示・履歴 =====
  function showResult(level, title, sub) {
    $result.className = 'result ' + level;
    $result.innerHTML = '<b>' + escapeHtml(title) + '</b><span class="sub">' + escapeHtml(sub || '') + '</span>';
  }

  function addLog(level, memberId, res) {
    var t = new Date();
    var hh = pad(t.getHours()) + ':' + pad(t.getMinutes()) + ':' + pad(t.getSeconds());
    var name = res && res.nickname ? res.nickname : '(不明)';
    var status = level === 'ok' ? 'OK' : (res && res.error === 'already_redeemed' ? '重複' : 'NG');
    var div = document.createElement('div');
    div.textContent = hh + '  [' + status + ']  ' + name + '  ' + memberId;
    $log.insertBefore(div, $log.firstChild);
  }

  // ===== タブ切替 =====
  function switchTab(name) {
    activeTab = name;
    document.querySelectorAll('.tab').forEach(function (t) {
      t.classList.toggle('is-active', t.dataset.tab === name);
    });
    document.querySelectorAll('.tabview').forEach(function (v) {
      v.hidden = (v.dataset.view !== name);
    });
    // 履歴タブに切り替えたら即リスト反映
    if (name === 'history') loadData();
  }
  document.querySelectorAll('.tab').forEach(function (t) {
    t.addEventListener('click', function () { switchTab(t.dataset.tab); });
  });
  if ($historyRefresh) $historyRefresh.addEventListener('click', loadData);

  // ===== 10秒ポーリング（配布人数カウンター＋履歴。常時稼働） =====
  function startPolling() {
    stopPolling();
    pollTimer = setInterval(function () {
      if (!document.hidden) loadData();
    }, 10000);
  }
  function stopPolling() {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  }
  // 端末スリープ/復帰時の無駄打ち抑制
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      stopPolling();
    } else {
      loadData();
      startPolling();
    }
  });

  // ===== 配布人数＋交換履歴取得（全スタッフ共有・サーバ記録） =====
  function loadData() {
    var cid = $sel.value || '';
    var campName = '';
    if (cid && $sel.options[$sel.selectedIndex]) {
      campName = $sel.options[$sel.selectedIndex].textContent || '';
    }
    if (!cid) {
      $distNumber.textContent = '―';
      $distUpdated.textContent = '';
      $historyTitle.textContent = '交換履歴';
      $historyCount.textContent = '―';
      $historyUpdated.textContent = '';
      $historyList.innerHTML = '<div class="history-empty">キャンペーンを選択してください。</div>';
      return;
    }
    $historyTitle.textContent = campName.replace(/\s*\([^)]*\)\s*$/, '') || '交換履歴';
    fetch(GAS_URL + '?mode=listRedemptions&key=' + encodeURIComponent(REQUIRED_KEY) +
          '&campaignId=' + encodeURIComponent(cid) + '&t=' + now())
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (!res || !res.ok) {
          $distUpdated.textContent = '取得失敗';
          $historyList.innerHTML = '<div class="history-empty">取得に失敗しました。</div>';
          return;
        }
        var total = (typeof res.totalCount === 'number') ? res.totalCount : res.count;
        // 配布人数カウンター（全タブ共通）
        $distNumber.textContent = total;
        $distUpdated.textContent = '更新 ' + nowLabel();
        // 履歴タブ内のヘッダ
        $historyCount.textContent = '交換 ' + total + ' 名';
        $historyUpdated.textContent = '最終更新 ' + nowLabel() +
          (res.count < total ? '（直近' + res.count + '件を表示）' : '');
        if (!res.items.length) {
          $historyList.innerHTML = '<div class="history-empty">まだ交換記録がありません。</div>';
          return;
        }
        var html = '';
        res.items.forEach(function (it) {
          html +=
            '<div class="history-row">' +
              '<span class="hr-name">' + escapeHtml(it.nickname || '(不明)') + '</span>' +
              '<span class="hr-meta">' + escapeHtml(it.ts || '') +
                (it.staff ? ' / ' + escapeHtml(it.staff) : '') + '</span>' +
            '</div>';
        });
        $historyList.innerHTML = html;
      })
      .catch(function () {
        $distUpdated.textContent = '通信エラー';
        $historyList.innerHTML = '<div class="history-empty">通信エラー。</div>';
      });
  }
  // キャンペーン変更時は即リロード（カウンターも履歴も）
  $sel.addEventListener('change', loadData);

  // ===== utils =====
  function nowLabel() {
    var t = new Date();
    return pad(t.getHours()) + ':' + pad(t.getMinutes()) + ':' + pad(t.getSeconds());
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function pad(n) { return n < 10 ? '0' + n : String(n); }
  function now() { return Date.now(); }
})();
</script>
</body>
</html>
